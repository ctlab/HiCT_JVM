name: Portable Packages

on:
  release:
    types: [published]
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      bundle_hictk:
        description: "Build and bundle hictk before packaging"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      hictk_ref:
        description: "Official hictk tag to bundle"
        required: true
        default: "v2.2.0"
        type: string
      minimap2_ref:
        description: "Official minimap2 tag to bundle for dotplot generation"
        required: true
        default: "v2.31"
        type: string
      mm2plus_ref:
        description: "mm2-plus tag to bundle as an optional accelerated dotplot aligner"
        required: true
        default: "v1.2"
        type: string
      webui_ref:
        description: "HiCT_WebUI branch/tag/ref to bundle; use same-as-jvm to match the selected HiCT_JVM branch"
        required: true
        default: "same-as-jvm"
        type: string
      create_windows_exe:
        description: "Create portable single-file Windows EXE in addition to portable ZIP"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      windows_exe_mode:
        description: "Windows EXE packaging mode: custom cached launcher by default, or legacy official 7-Zip SFX"
        required: true
        default: "custom"
        type: choice
        options:
          - "custom"
          - "7zip-sfx"
      bundle_tauri_browser:
        description: "Build and bundle the HiCT Tauri WebView browser payload"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      bundle_electron_browser:
        description: "Build and bundle the HiCT Electron browser payload"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_target:
        description: "Manual publish target after building artifacts"
        required: true
        default: "artifacts-only"
        type: choice
        options:
          - "artifacts-only"
          - "latest-master"
          - "release-tag"
      release_tag:
        description: "Existing release tag to attach assets to when publish_target=release-tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.event_name == 'push' && github.ref || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master' && 'latest-master' || github.event_name == 'workflow_dispatch' && inputs.publish_target == 'release-tag' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  linux-portable:
    name: Linux portable .run
    runs-on: ubuntu-22.04
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
      HICTK_CONAN_HOME: ${{ github.workspace }}/.cache/hictk-conan/linux_x86_64
      HICT_REQUIRE_NATIVE_PROCESSING_VARIANTS: "1"
      # Linux release target: manylinux2014 / CentOS 7 ABI floor.
      # Native payloads are built inside quay.io/pypa/manylinux2014_x86_64.
      # Do not combine this mode with musl-static flags unless you intentionally
      # want a separate musl artifact.
      HICT_STATIC_MUSL: "1"
      HICT_STATIC_MIMALLOC: "1"
      HICT_GLIBC_MAX: "2.17"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node.js tooling
        run: |
          node --version
          npm --version

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache HiCT native processing libraries
        uses: actions/cache@v5
        with:
          path: build/native-processing/resources
          key: hict-native-linux-x86_64-manylinux2014-glibc217-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-${{ hashFiles('build.gradle.kts', 'src/main/native/**') }}

      - name: Set up Rust
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Tauri cargo cache
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/tauri-target/linux_x86_64
          key: tauri-linux-x86_64-${{ env.HICT_WEBUI_REF }}-${{ hashFiles('scripts/portable/prepare_tauri_browser_payload_linux.sh') }}
          restore-keys: |
            tauri-linux-x86_64-${{ env.HICT_WEBUI_REF }}-
            tauri-linux-x86_64-

      - name: Install Linux packaging and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential curl file gzip tar xz-utils zip unzip \
            pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Grant execute permissions
        run: |
          chmod +x gradlew \
            scripts/portable/build_portable_linux.sh \
            scripts/portable/prepare_tauri_browser_payload_linux.sh \
            scripts/portable/prepare_electron_browser_payload_linux.sh \
            scripts/toolchains/build_hictk_linux.sh \
            scripts/toolchains/build_minimap2_linux.sh \
            scripts/toolchains/build_mm2plus_linux.sh

      - name: Prepare WebUI resources on Ubuntu
        env:
          HICT_REQUIRE_BUNDLED_WEBUI: "1"
        run: |
          set -euxo pipefail
          ./gradlew -PrequireBundledWebUI=true copyWebUI -x verifyNativeProcessingBuild -x natives --no-daemon
          test -f src/main/resources/webui/index.html

      - name: Build bundled Tauri browser on Ubuntu
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}/..
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/tauri-target/linux_x86_64
        run: ./scripts/portable/prepare_tauri_browser_payload_linux.sh

      - name: Build bundled Electron browser on Ubuntu
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_electron_browser == 'true') }}
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}/..
        run: ./scripts/portable/prepare_electron_browser_payload_linux.sh

      - name: Restore bundled toolchain cache
        id: cache-hictk
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: toolchains-dist/linux_x86_64
          key: toolchain-v5-linux-x86_64-manylinux2014-glibc217-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_linux.sh', 'scripts/toolchains/build_minimap2_linux.sh') }}

      - name: Restore bundled mm2-plus cache
        id: cache-mm2plus
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            toolchains-dist/linux_x86_64/bin/mm2plus-avx2
            toolchains-dist/linux_x86_64/bin/mm2plus-avx512
            toolchains-dist/linux_x86_64/share/licenses/mm2plus
            toolchains-dist/linux_x86_64/share/doc/mm2plus
          key: toolchain-mm2plus-v5-linux-x86_64-manylinux2014-glibc217-${{ env.MM2PLUS_REF }}-${{ hashFiles('scripts/toolchains/build_mm2plus_linux.sh') }}

      - name: Inspect bundled toolchain cache
        id: inspect-toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        run: |
          set -euxo pipefail

          manifest="toolchains-dist/linux_x86_64/manifest.json"
          hictk_ready=false
          minimap2_ready=false
          mm2plus_avx2_ready=false
          mm2plus_avx512_ready=false
          mm2plus_ref_ready=false

          version_gt() {
            local a="$1"
            local b="$2"
            [[ "$(printf '%s\n%s\n' "$b" "$a" | sort -V | tail -n 1)" == "$a" && "$a" != "$b" ]]
          }

          validate_glibc_floor() {
            local label="$1"
            local path="$2"
            local max_allowed="${HICT_GLIBC_MAX:-2.17}"

            if [[ ! -x "${path}" ]]; then
              echo "::warning::Cached ${label} is missing or not executable: ${path}"
              return 1
            fi

            file -b "${path}" | grep -q 'ELF.*x86-64' || return 0

            local bad=0
            while read -r sym; do
              [[ -z "${sym:-}" ]] && continue
              local ver="${sym#GLIBC_}"
              if version_gt "${ver}" "${max_allowed}"; then
                echo "::warning::Cached ${label} requires ${sym}, above GLIBC_${max_allowed}; forcing rebuild."
                bad=1
              fi
            done < <(
              objdump -T "${path}" 2>/dev/null |
                awk '/\*UND\*/ && match($0, /\(GLIBC_[^)]+\)/) { print substr($0, RSTART + 1, RLENGTH - 2) }' |
                sort -Vu
            )

            [[ "${bad}" == "0" ]]
          }

          if [[ -f "toolchains-dist/linux_x86_64/share/doc/mm2plus/build-info.txt" ]] && grep -qx "ref=${MM2PLUS_REF}" "toolchains-dist/linux_x86_64/share/doc/mm2plus/build-info.txt"; then
            mm2plus_ref_ready=true
          fi

          if [[ -f "${manifest}" ]]; then
            if grep -q '"hictk"' "${manifest}" && validate_glibc_floor "hictk" "toolchains-dist/linux_x86_64/bin/hictk"; then
              hictk_ready=true
            fi
            if grep -q '"minimap2"' "${manifest}" && validate_glibc_floor "minimap2" "toolchains-dist/linux_x86_64/bin/minimap2"; then
              minimap2_ready=true
            fi
          fi

          if [[ "${mm2plus_ref_ready}" == "true" ]] && [[ -f "${manifest}" ]] && grep -q '"mm2plus_avx2"' "${manifest}" && validate_glibc_floor "mm2-plus AVX2" "toolchains-dist/linux_x86_64/bin/mm2plus-avx2"; then
            mm2plus_avx2_ready=true
          fi
          if [[ "${mm2plus_ref_ready}" == "true" ]] && [[ -f "${manifest}" ]] && grep -q '"mm2plus_avx512"' "${manifest}" && validate_glibc_floor "mm2-plus AVX-512" "toolchains-dist/linux_x86_64/bin/mm2plus-avx512"; then
            mm2plus_avx512_ready=true
          fi

          echo "hictk_ready=${hictk_ready}" >> "${GITHUB_OUTPUT}"
          echo "minimap2_ready=${minimap2_ready}" >> "${GITHUB_OUTPUT}"
          echo "mm2plus_avx2_ready=${mm2plus_avx2_ready}" >> "${GITHUB_OUTPUT}"
          echo "mm2plus_avx512_ready=${mm2plus_avx512_ready}" >> "${GITHUB_OUTPUT}"
          echo "hictk_ready=${hictk_ready}, minimap2_ready=${minimap2_ready}, mm2plus_avx2_ready=${mm2plus_avx2_ready}, mm2plus_avx512_ready=${mm2plus_avx512_ready}"

      - name: Restore hictk Conan package cache
        id: cache-hictk-conan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/linux_x86_64
          key: hictk-conan-linux-x86_64-manylinux2014-glibc217-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_linux.sh') }}
          restore-keys: |
            hictk-conan-linux-x86_64-manylinux2014-glibc217-${{ env.HICTK_REF }}-
            hictk-conan-linux-x86_64-manylinux2014-glibc217-

      - name: Build Linux native payload and fat JAR in manylinux2014
        env:
          BUNDLE_HICTK: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
          HICTK_READY: ${{ steps.inspect-toolchain.outputs.hictk_ready }}
          MINIMAP2_READY: ${{ steps.inspect-toolchain.outputs.minimap2_ready }}
          MM2PLUS_AVX2_READY: ${{ steps.inspect-toolchain.outputs.mm2plus_avx2_ready }}
          MM2PLUS_AVX512_READY: ${{ steps.inspect-toolchain.outputs.mm2plus_avx512_ready }}
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${JAVA_HOME}:${JAVA_HOME}:ro" \
            -w "${GITHUB_WORKSPACE}" \
            -e JAVA_HOME="${JAVA_HOME}" \
            -e GRADLE_USER_HOME="${GRADLE_USER_HOME}" \
            -e GRADLE_OPTS="${GRADLE_OPTS}" \
            -e HICTK_REF="${HICTK_REF}" \
            -e MINIMAP2_REF="${MINIMAP2_REF}" \
            -e MM2PLUS_REF="${MM2PLUS_REF}" \
            -e HICT_WEBUI_REF="${HICT_WEBUI_REF}" \
            -e HICTK_CONAN_HOME="${HICTK_CONAN_HOME}" \
            -e HICT_REQUIRE_NATIVE_PROCESSING_VARIANTS="1" \
            -e HICT_REQUIRE_MM2PLUS_VARIANTS="1" \
            -e HICT_STATIC_MUSL="0" \
            -e HICT_STATIC_MIMALLOC="0" \
            -e BUNDLE_HICTK="${BUNDLE_HICTK}" \
            -e HICTK_READY="${HICTK_READY:-false}" \
            -e MINIMAP2_READY="${MINIMAP2_READY:-false}" \
            -e MM2PLUS_AVX2_READY="${MM2PLUS_AVX2_READY:-false}" \
            -e MM2PLUS_AVX512_READY="${MM2PLUS_AVX512_READY:-false}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -lc '
              set -exo pipefail

              yum install -y \
                autoconf automake binutils bzip2-devel curl diffutils file findutils \
                gcc gcc-c++ git gzip libtool make openssl-devel patch pkgconfig \
                tar unzip which xz xz-devel zip zlib-devel

              enable_devtoolset() {
                local enable_script=""
                for candidate in \
                  /opt/rh/devtoolset-10/enable \
                  /opt/rh/devtoolset-9/enable \
                  /opt/rh/devtoolset-8/enable; do
                  if [[ -f "${candidate}" ]]; then
                    enable_script="${candidate}"
                    break
                  fi
                done

                if [[ -z "${enable_script}" ]]; then
                  echo "No devtoolset enable script found; using the default compiler toolchain."
                  return 0
                fi

                echo "Sourcing ${enable_script}"
                # SCL/devtoolset enable scripts reference variables such as
                # MANPATH before defining them. This is fine in normal shell
                # usage, but fails under `set -u`, so disable nounset only
                # while sourcing the vendor script.
                set +u
                source "${enable_script}"
                set -u
              }
              enable_devtoolset

              find_manylinux_python() {
                local candidate=""
                for candidate in                   /opt/python/cp311-cp311/bin/python3                   /opt/python/cp311-cp311/bin/python                   /opt/python/cp310-cp310/bin/python3                   /opt/python/cp310-cp310/bin/python                   /opt/python/cp312-cp312/bin/python3                   /opt/python/cp312-cp312/bin/python                   /opt/python/cp39-cp39/bin/python3                   /opt/python/cp39-cp39/bin/python                   /opt/python/cp38-cp38/bin/python3                   /opt/python/cp38-cp38/bin/python                   /opt/python/cp313-cp313/bin/python3                   /opt/python/cp313-cp313/bin/python; do
                  if [[ -e "${candidate}" ]]; then
                    printf '%s\n' "${candidate}"
                    return 0
                  fi
                done

                find /opt/python -maxdepth 4 \( -name python3 -o -name python \) -print 2>/dev/null | sort -V | tail -n 1
              }

              PYBIN="$(find_manylinux_python || true)"
              if [[ -z "${PYBIN}" || ! -e "${PYBIN}" ]]; then
                echo "Unable to find a manylinux Python under /opt/python." >&2
                echo "Available /opt/python entries:" >&2
                find /opt/python -maxdepth 3 -print 2>/dev/null | sort >&2 || true
                exit 1
              fi
              ln -sfn "${PYBIN}" /usr/local/bin/python3

              export PATH="${JAVA_HOME}/bin:/usr/local/bin:$(dirname "${PYBIN}"):${PATH}"

              python3 --version
              java -version
              gcc --version | head -n 1
              g++ --version | head -n 1

              python3 -m ensurepip --upgrade >/dev/null 2>&1 || true
              python3 -m pip install --upgrade pip
              python3 -m pip install "cmake>=3.25" ninja "conan>=2"

              # CentOS 7 ships Git 1.8, which does not understand
              # `git clone --filter=blob:none`. Pre-clone these repos without
              # partial-clone filters so the existing build scripts reuse them.
              preclone_plain_git_repo() {
                local work_dir="$1"
                local repo_url="$2"
                mkdir -p "${work_dir}"
                if [[ ! -d "${work_dir}/src/.git" ]]; then
                  rm -rf "${work_dir}/src"
                  git clone "${repo_url}" "${work_dir}/src"
                fi
              }
              preclone_plain_git_repo "${MINIMAP2_WORK_DIR:-/tmp/minimap2-build-linux-x86_64}" "${MINIMAP2_REPO_URL:-https://github.com/lh3/minimap2.git}"
              preclone_plain_git_repo "${MM2PLUS_WORK_DIR:-/tmp/mm2plus-build-linux-x86_64}" "${MM2PLUS_REPO_URL:-https://github.com/at-cg/mm2-plus.git}"

              chmod +x gradlew \
                scripts/toolchains/build_hictk_linux.sh \
                scripts/toolchains/build_minimap2_linux.sh \
                scripts/toolchains/build_mm2plus_linux.sh

              if [[ "${BUNDLE_HICTK}" == "true" ]]; then
                if [[ "${HICTK_READY:-false}" != "true" ]]; then
                  ENABLE_MOSTLY_STATIC_RUNTIME=1 ./scripts/toolchains/build_hictk_linux.sh
                fi
                if [[ "${MINIMAP2_READY:-false}" != "true" ]]; then
                  ./scripts/toolchains/build_minimap2_linux.sh
                fi
                if [[ "${MM2PLUS_AVX2_READY:-false}" != "true" || "${MM2PLUS_AVX512_READY:-false}" != "true" ]]; then
                  HICT_REQUIRE_MM2PLUS_VARIANTS=1 \
                  HICT_STATIC_MUSL=0 \
                  HICT_STATIC_MIMALLOC=0 \
                    ./scripts/toolchains/build_mm2plus_linux.sh
                fi
              else
                rm -rf toolchains-dist/linux_x86_64
              fi

              # WebUI has already been prepared on Ubuntu, where Node.js 24 works.
              # Exclude WebUI tasks here so manylinux only compiles Linux-native code
              # and assembles the fat JAR with the already prepared resources.
              ./gradlew -PrequireBundledWebUI=true shadowJar -x buildWebUI -x copyWebUI --no-daemon

              ./gradlew --stop || true
              chown -R "${HOST_UID}:${HOST_GID}" build toolchains-dist .cache .gradle src/main/resources/webui 2>/dev/null || true
            '

      - name: Verify bundled toolchain payload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        run: |
          manifest="toolchains-dist/linux_x86_64/manifest.json"
          missing=0
          require_manifest_entry() {
            local key="$1"
            local path="$2"
            local executable="$3"
            if ! grep -q "\"${key}\"" "${manifest}"; then
              echo "::error::Linux bundled ${key} is required for default portable releases but is missing from ${manifest}."
              missing=1
              return
            fi
            if [[ "${executable}" == "true" ]]; then
              if [[ ! -x "${path}" ]]; then
                echo "::error::Linux bundled ${key} is listed in the manifest but ${path} is missing or not executable."
                missing=1
              fi
            elif [[ ! -f "${path}" ]]; then
              echo "::error::Linux bundled ${key} is listed in the manifest but ${path} is missing."
              missing=1
            fi
          }
          if [[ ! -f "${manifest}" ]]; then
            echo "::error::No Linux bundled toolchain manifest was produced. Default portable releases must bundle hictk, minimap2, and mm2-plus AVX2/AVX-512."
            exit 1
          fi
          require_manifest_entry "hictk" "toolchains-dist/linux_x86_64/bin/hictk" "true"
          require_manifest_entry "minimap2" "toolchains-dist/linux_x86_64/bin/minimap2" "true"
          require_manifest_entry "mm2plus_avx2" "toolchains-dist/linux_x86_64/bin/mm2plus-avx2" "true"
          require_manifest_entry "mm2plus_avx512" "toolchains-dist/linux_x86_64/bin/mm2plus-avx512" "true"
          if [[ "${missing}" != "0" ]]; then
            exit 1
          fi
          toolchains-dist/linux_x86_64/bin/hictk --version
          toolchains-dist/linux_x86_64/bin/minimap2 --version
          toolchains-dist/linux_x86_64/bin/mm2plus-avx2 --version

      - name: Save hictk Conan package cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' && steps.cache-hictk-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/linux_x86_64
          key: ${{ steps.cache-hictk-conan.outputs.cache-primary-key }}

      - name: Save bundled toolchain cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.hictk_ready != 'true' || steps.inspect-toolchain.outputs.minimap2_ready != 'true') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/linux_x86_64
          key: ${{ steps.cache-hictk.outputs.cache-primary-key }}

      - name: Save bundled mm2-plus cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.cache-mm2plus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            toolchains-dist/linux_x86_64/bin/mm2plus-avx2
            toolchains-dist/linux_x86_64/bin/mm2plus-avx512
            toolchains-dist/linux_x86_64/share/licenses/mm2plus
            toolchains-dist/linux_x86_64/share/doc/mm2plus
          key: ${{ steps.cache-mm2plus.outputs.cache-primary-key }}

      - name: Build Linux portable package on Ubuntu
        env:
          HICT_SKIP_GRADLE: "1"
        run: ./scripts/portable/build_portable_linux.sh

      - name: Check Linux GLIBC floor
        run: |
          set -euo pipefail

          max_allowed="${HICT_GLIBC_MAX:-2.17}"
          root="$(find build/portable -mindepth 1 -maxdepth 1 -type d -name 'HiCT-*-linux-x86_64' | sort | tail -n 1)"
          jar_file="$(find "${root}" -path '*/lib/hict.jar' -type f | sort | tail -n 1)"

          if [[ -z "${root}" || ! -d "${root}" ]]; then
            echo "::error::Portable Linux root was not found under build/portable."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          if [[ -n "${jar_file}" && -f "${jar_file}" ]]; then
            (cd "${tmp}" && jar xf "${jar_file}")
          fi

          version_gt() {
            local a="$1"
            local b="$2"
            [[ "$(printf '%s\n%s\n' "$b" "$a" | sort -V | tail -n 1)" == "$a" && "$a" != "$b" ]]
          }

          scan_tree() {
            local tree="$1"
            find "${tree}" -type f -print0 |
            while IFS= read -r -d '' f; do
              case "${f}" in
                */FreeBSD/*|*/SunOS/*|*/Linux/arm/*|*/Linux/armv6/*|*/Linux/armv7/*|*/Linux/aarch64/*|*/Linux/ppc/*|*/Linux/ppc64/*|*/Linux/ppc64le/*|*/Linux/s390x/*|*/Linux/riscv64/*)
                  continue
                  ;;
              esac

              file -b "${f}" | grep -q 'ELF.*x86-64' || continue

              objdump -T "${f}" 2>/dev/null |
                awk -v f="${f}" '
                  /\*UND\*/ && match($0, /\(GLIBC_[^)]+\)/) {
                    v = substr($0, RSTART + 1, RLENGTH - 2)
                    print v, f
                  }
                '
            done
          }

          bad=0
          while read -r sym file; do
            [[ -z "${sym:-}" ]] && continue
            ver="${sym#GLIBC_}"
            if version_gt "${ver}" "${max_allowed}"; then
              echo "::error::${file} requires ${sym}, above GLIBC_${max_allowed}"
              bad=1
            fi
          done < <((scan_tree "${root}"; scan_tree "${tmp}") | sort -Vu)

          if [[ "${bad}" != "0" ]]; then
            echo "One or more Linux x86_64 ELF files exceed the portable GLIBC_${max_allowed} floor." >&2
            echo "If the offender is under lib/native/jhdf5, lib/natives, or lib/libs/natives," >&2
            echo "it is coming from the bundled JHDF5/HDF5 native payload and must be replaced" >&2
            echo "with a manylinux2014-built native payload or removed from the fat JAR." >&2
            exit 1
          fi

      - name: Upload JVM fat JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-jvm-fat-jar
          path: build/libs/*-fat.jar
          if-no-files-found: error

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-linux-portable
          path: |
            build/distributions/HiCT-*-linux-x86_64.run
            build/distributions/HiCT-*-linux-x86_64.tar.gz
            build/distributions/HiCT-*-linux-x86_64.sha256
          if-no-files-found: error

      - name: Upload Linux runfile artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-linux-runfile
          path: |
            build/distributions/HiCT-*-linux-x86_64.run
            build/distributions/HiCT-*-linux-x86_64.sha256
          if-no-files-found: error

      - name: Validate Linux artifacts after upload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        run: |
          set -uo pipefail

          runfile="$(find build/distributions -maxdepth 1 -type f -name 'HiCT-*-linux-x86_64.run' | sort | tail -n 1)"
          portable_bin="$(find build/portable -path '*/bin/hict' -type f | sort | tail -n 1)"

          failed=0

          check_binary() {
            local label="$1"
            local path="$2"
            local warning_only="${3:-false}"

            if [[ -z "${path}" || ! -e "${path}" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::Linux validation: ${label} is missing."
                return 0
              fi

              echo "::error::Linux validation: ${label} is missing."
              return 1
            fi

            if [[ "${path}" != *.run ]] && [[ ! -x "${path}" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::Linux validation: ${label} is not executable at ${path}."
                return 0
              fi

              echo "::error::Linux validation: ${label} is not executable at ${path}."
              return 1
            fi

            echo "Testing ${label}: ${path}"

            "${path}" --help >/dev/null 2>&1
            local exit_code=$?

            if [[ "${exit_code}" != "0" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::Linux validation: ${label} failed its --help smoke test with exit code ${exit_code}."
                return 0
              fi

              echo "::error::Linux validation: ${label} failed its --help smoke test with exit code ${exit_code}."
              return 1
            fi

            echo "Linux validation: ${label} passed."
            return 0
          }

          check_binary "portable runfile" "${runfile}" || failed=1
          check_binary "portable hict binary" "${portable_bin}" || failed=1
          check_binary "hictk" "toolchains-dist/linux_x86_64/bin/hictk" || failed=1
          check_binary "minimap2" "toolchains-dist/linux_x86_64/bin/minimap2" || failed=1
          check_binary "mm2-plus AVX2" "toolchains-dist/linux_x86_64/bin/mm2plus-avx2" || failed=1

          # AVX-512 may fail on runners without AVX-512 CPU support.
          # Keep the artifact check visible, but do not fail the workflow.
          check_binary "mm2-plus AVX-512" "toolchains-dist/linux_x86_64/bin/mm2plus-avx512" true || true

          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

          exit 0

  windows-portable:
    name: Windows portable ZIP and EXE
    runs-on: windows-2022
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
      HICTK_CONAN_HOME: ${{ github.workspace }}\.cache\hictk-conan\windows_x86_64
      HICT_WINDOWS_EXE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_exe_mode || 'custom' }}
      HICT_REQUIRE_NATIVE_PROCESSING_VARIANTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node.js tooling
        shell: pwsh
        run: |
          node --version
          npm.cmd --version

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache HiCT native processing libraries
        uses: actions/cache@v5
        with:
          path: build/native-processing/resources
          key: hict-native-windows-x86_64-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-${{ hashFiles('build.gradle.kts', 'src/main/native/**') }}

      - name: Set up Rust
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Tauri cargo cache
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/tauri-target/windows_x86_64
          key: tauri-windows-x86_64-${{ env.HICT_WEBUI_REF }}-${{ hashFiles('scripts/portable/prepare_tauri_browser_payload_windows.ps1') }}
          restore-keys: |
            tauri-windows-x86_64-${{ env.HICT_WEBUI_REF }}-
            tauri-windows-x86_64-

      - name: Restore bundled toolchain cache
        id: cache-hictk
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: toolchains-dist/windows_x86_64
          key: toolchain-v3-windows-x86_64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_windows.ps1', 'scripts/toolchains/build_minimap2_windows.ps1') }}
          restore-keys: |
            toolchain-v3-windows-x86_64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-

      - name: Restore bundled mm2-plus cache
        id: cache-mm2plus
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            toolchains-dist/windows_x86_64/bin/mm2plus-avx2.exe
            toolchains-dist/windows_x86_64/bin/mm2plus-avx512.exe
            toolchains-dist/windows_x86_64/share/licenses/mm2plus
            toolchains-dist/windows_x86_64/share/doc/mm2plus
          key: toolchain-mm2plus-v2-windows-x86_64-${{ env.MM2PLUS_REF }}-${{ hashFiles('scripts/toolchains/build_mm2plus_windows.ps1') }}
          restore-keys: |
            toolchain-mm2plus-v2-windows-x86_64-${{ env.MM2PLUS_REF }}-

      - name: Inspect bundled toolchain cache
        id: inspect-toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        shell: pwsh
        run: |
          $manifest = "toolchains-dist\windows_x86_64\manifest.json"
          $hictkReady = "false"
          $minimap2Ready = "false"
          $mm2PlusAvx2Ready = "false"
          $mm2PlusAvx512Ready = "false"
          $mm2PlusRefReady = "false"
          $mm2PlusBuildInfo = "toolchains-dist\windows_x86_64\share\doc\mm2plus\build-info.txt"
          if ((Test-Path $mm2PlusBuildInfo) -and (Select-String -Path $mm2PlusBuildInfo -Pattern "^ref=$([regex]::Escape($env:MM2PLUS_REF))$" -Quiet)) {
            $mm2PlusRefReady = "true"
          }
          $manifestText = ""
          if (Test-Path $manifest) {
            $manifestText = Get-Content -Raw $manifest
            if ($manifestText -match '"hictk"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\hictk.exe")) {
              $hictkReady = "true"
            }
            if ($manifestText -match '"minimap2"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\minimap2.exe")) {
              $minimap2Ready = "true"
            }
          }
          if ($mm2PlusRefReady -eq "true" -and (Test-Path $manifest) -and $manifestText -match '"mm2plus_avx2"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\mm2plus-avx2.exe")) {
            $mm2PlusAvx2Ready = "true"
          }
          if ($mm2PlusRefReady -eq "true" -and (Test-Path $manifest) -and $manifestText -match '"mm2plus_avx512"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\mm2plus-avx512.exe")) {
            $mm2PlusAvx512Ready = "true"
          }
          "hictk_ready=$hictkReady" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "minimap2_ready=$minimap2Ready" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mm2plus_avx2_ready=$mm2PlusAvx2Ready" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mm2plus_avx512_ready=$mm2PlusAvx512Ready" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "hictk_ready=$hictkReady, minimap2_ready=$minimap2Ready, mm2plus_avx2_ready=$mm2PlusAvx2Ready, mm2plus_avx512_ready=$mm2PlusAvx512Ready"

      - name: Restore hictk Conan package cache
        id: cache-hictk-conan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/windows_x86_64
          key: hictk-conan-windows-x86_64-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_windows.ps1') }}
          restore-keys: |
            hictk-conan-windows-x86_64-${{ env.HICTK_REF }}-
            hictk-conan-windows-x86_64-

      - name: Configure MSVC environment
        if: ${{ ((github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true') || (github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true' && inputs.windows_exe_mode == 'custom')) }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found. Visual Studio Build Tools are required for hictk/custom EXE builds."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "No Visual Studio installation with MSVC x64 tools was found."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at $vcvars."
          }

          $env:VSCMD_SKIP_SENDTELEMETRY = "1"
          $envDump = cmd.exe /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed with exit code $LASTEXITCODE."
          }

          $namesToExport = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          @(
            "Path",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "EXTERNAL_INCLUDE",
            "CommandPromptType",
            "DevEnvDir",
            "ExtensionSdkDir",
            "FrameworkDir",
            "FrameworkDir64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "IFCPATH",
            "NETFXSDKDir",
            "Platform",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCPKG_ROOT",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSdkVerBinPath",
            "WindowsSDKVersion"
          ) | ForEach-Object { [void]$namesToExport.Add($_) }

          foreach ($line in $envDump) {
            $separator = $line.IndexOf("=")
            if ($separator -le 0) {
              continue
            }
            $name = $line.Substring(0, $separator)
            if (-not $namesToExport.Contains($name)) {
              continue
            }
            $value = $line.Substring($separator + 1)
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build bundled hictk
        id: build-hictk
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        shell: pwsh
        run: .\scripts\toolchains\build_hictk_windows.ps1 -MostlyStaticRuntime

      - name: Build bundled minimap2
        id: build-minimap2
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.minimap2_ready != 'true' }}
        shell: pwsh
        run: .\scripts\toolchains\build_minimap2_windows.ps1

      - name: Build bundled mm2-plus
        id: build-mm2plus
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.mm2plus_avx2_ready != 'true' || steps.inspect-toolchain.outputs.mm2plus_avx512_ready != 'true') }}
        shell: pwsh
        env:
          HICT_REQUIRE_MM2PLUS_VARIANTS: "1"
        run: .\scripts\toolchains\build_mm2plus_windows.ps1

      - name: Verify bundled toolchain payload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        shell: pwsh
        run: |
          $manifest = "toolchains-dist\windows_x86_64\manifest.json"
          if (-not (Test-Path $manifest)) {
            Write-Host "::error::No Windows bundled toolchain manifest was produced. Default portable releases must bundle hictk, minimap2, and mm2-plus AVX2/AVX-512."
            exit 1
          }
          $manifestText = Get-Content -Raw $manifest
          $required = @(
            @{ Key = "hictk"; Path = "toolchains-dist\windows_x86_64\bin\hictk.exe" },
            @{ Key = "minimap2"; Path = "toolchains-dist\windows_x86_64\bin\minimap2.exe" },
            @{ Key = "mm2plus_avx2"; Path = "toolchains-dist\windows_x86_64\bin\mm2plus-avx2.exe" },
            @{ Key = "mm2plus_avx512"; Path = "toolchains-dist\windows_x86_64\bin\mm2plus-avx512.exe" }
          )
          $missing = $false
          foreach ($entry in $required) {
            if ($manifestText -notmatch ('"' + [regex]::Escape($entry.Key) + '"')) {
              Write-Host "::error::Windows bundled $($entry.Key) is required for default portable releases but is missing from $manifest."
              $missing = $true
              continue
            }
            if (-not (Test-Path $entry.Path)) {
              Write-Host "::error::Windows bundled $($entry.Key) is listed in the manifest but $($entry.Path) is missing."
              $missing = $true
            }
          }
          if ($missing) {
            exit 1
          }
          & "toolchains-dist\windows_x86_64\bin\hictk.exe" --version
          & "toolchains-dist\windows_x86_64\bin\minimap2.exe" --version
          & "toolchains-dist\windows_x86_64\bin\mm2plus-avx2.exe" --version

      - name: Save hictk Conan package cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' && steps.cache-hictk-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/windows_x86_64
          key: ${{ steps.cache-hictk-conan.outputs.cache-primary-key }}

      - name: Save bundled toolchain cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.hictk_ready != 'true' || steps.inspect-toolchain.outputs.minimap2_ready != 'true') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/windows_x86_64
          key: ${{ steps.cache-hictk.outputs.cache-primary-key }}

      - name: Save bundled mm2-plus cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.cache-mm2plus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            toolchains-dist/windows_x86_64/bin/mm2plus-avx2.exe
            toolchains-dist/windows_x86_64/bin/mm2plus-avx512.exe
            toolchains-dist/windows_x86_64/share/licenses/mm2plus
            toolchains-dist/windows_x86_64/share/doc/mm2plus
          key: ${{ steps.cache-mm2plus.outputs.cache-primary-key }}

      - name: Install 7-Zip for portable EXE
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        shell: pwsh
        run: choco install 7zip.install -y --no-progress

      - name: Build bundled Tauri browser
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        shell: pwsh
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}\..
          CARGO_TARGET_DIR: ${{ github.workspace }}\.cache\tauri-target\windows_x86_64
        run: .\scripts\portable\prepare_tauri_browser_payload_windows.ps1

      - name: Build bundled Electron browser
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_electron_browser == 'true') }}
        shell: pwsh
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}\..
        run: .\scripts\portable\prepare_electron_browser_payload_windows.ps1

      - name: Build Windows portable package and EXE
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        shell: pwsh
        run: .\scripts\portable\build_portable_windows.ps1 -CreateSelfExtractingExe -WindowsExeMode $env:HICT_WINDOWS_EXE_MODE

      - name: Build Windows portable package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_windows_exe != 'true' }}
        shell: pwsh
        run: .\scripts\portable\build_portable_windows.ps1

      - name: Stop Gradle daemons
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path ".\gradlew.bat") {
            .\gradlew.bat --stop
          }
        continue-on-error: true

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-windows-portable
          path: |
            build/distributions/HiCT-*-windows-x86_64-portable.zip
            build/distributions/HiCT-*-windows-x86_64.exe
            build/distributions/HiCT-*-windows-x86_64.sha256

      - name: Upload Windows EXE artifact
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: hict-windows-exe
          path: |
            build/distributions/HiCT-*-windows-x86_64.exe
            build/distributions/HiCT-*-windows-x86_64.sha256
          if-no-files-found: error

      - name: Validate Windows artifacts after upload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        shell: pwsh
        run: |
          function Test-BinarySmoke {
            param(
              [string]$Label,
              [string]$Path,
              [switch]$WarningOnly
            )

            if ([string]::IsNullOrWhiteSpace($Path) -or -not (Test-Path $Path)) {
              if ($WarningOnly) {
                Write-Host "::warning::Windows validation: $Label is missing."
                return $true
              }

              Write-Host "::error::Windows validation: $Label is missing."
              return $false
            }

            Write-Host ("Testing {0}: {1}" -f $Label, $Path)

            $exitCode = 0

            try {
              & $Path --help *> $null
              $exitCode = $LASTEXITCODE
            } catch {
              $exitCode = $LASTEXITCODE
              if ($null -eq $exitCode) {
                $exitCode = 1
              }
            } finally {
              # Critical: GitHub's pwsh wrapper exits with $LASTEXITCODE if it is non-zero.
              $global:LASTEXITCODE = 0
            }

            if ($exitCode -ne 0) {
              if ($WarningOnly) {
                Write-Host "::warning::Windows validation: $Label failed its --help smoke test with exit code $exitCode."
                return $true
              }

              Write-Host "::error::Windows validation: $Label failed its --help smoke test with exit code $exitCode."
              return $false
            }

            Write-Host "Windows validation: $Label passed."
            return $true
          }

          $failed = $false

          $exe = Get-ChildItem -Path "build\distributions" -Filter "HiCT-*-windows-x86_64.exe" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not (Test-BinarySmoke -Label "portable exe" -Path $(if ($exe) { $exe.FullName } else { "" }))) {
            $failed = $true
          }
          if (-not (Test-BinarySmoke -Label "hictk" -Path "toolchains-dist\windows_x86_64\bin\hictk.exe")) {
            $failed = $true
          }
          if (-not (Test-BinarySmoke -Label "minimap2" -Path "toolchains-dist\windows_x86_64\bin\minimap2.exe")) {
            $failed = $true
          }
          if (-not (Test-BinarySmoke -Label "mm2-plus AVX2" -Path "toolchains-dist\windows_x86_64\bin\mm2plus-avx2.exe")) {
            $failed = $true
          }

          # AVX-512 binary may fail on GitHub-hosted runners without AVX-512 CPU support.
          # This should warn, but must not fail the release workflow.
          [void](Test-BinarySmoke -Label "mm2-plus AVX-512" -Path "toolchains-dist\windows_x86_64\bin\mm2plus-avx512.exe" -WarningOnly)

          $global:LASTEXITCODE = 0

          if ($failed) {
            exit 1
          }

          exit 0

  macos-portable:
    name: macOS portable .run
    runs-on: macos-14
    continue-on-error: true
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
      HICTK_CONAN_HOME: ${{ github.workspace }}/.cache/hictk-conan/darwin_arm64
      HICT_REQUIRE_NATIVE_PROCESSING_VARIANTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node.js tooling
        run: |
          node --version
          npm --version

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore HiCT native processing libraries
        id: cache-native-processing
        uses: actions/cache/restore@v5
        with:
          path: build/native-processing/resources
          key: hict-native-macos-arm64-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-${{ hashFiles('build.gradle.kts', 'src/main/native/**') }}
          restore-keys: |
            hict-native-macos-arm64-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-

      - name: Grant execute permissions
        run: chmod +x gradlew scripts/portable/build_portable_darwin_arm64.sh scripts/toolchains/build_darwin_toolchains.sh

      - name: Restore Darwin toolchain cache
        id: cache-darwin-toolchains
        uses: actions/cache/restore@v5
        with:
          path: toolchains-dist/darwin_arm64
          key: toolchain-v1-darwin-arm64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-mm2plus-${{ env.MM2PLUS_REF }}-${{ hashFiles('scripts/toolchains/build_darwin_toolchains.sh') }}
          restore-keys: |
            toolchain-v1-darwin-arm64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-mm2plus-${{ env.MM2PLUS_REF }}-

      - name: Restore Darwin Conan cache
        id: cache-darwin-conan
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/darwin_arm64
          key: hictk-conan-darwin-arm64-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_darwin_toolchains.sh') }}
          restore-keys: |
            hictk-conan-darwin-arm64-${{ env.HICTK_REF }}-
            hictk-conan-darwin-arm64-

      - name: Build macOS portable package
        run: ./scripts/portable/build_portable_darwin_arm64.sh

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-darwin-portable
          path: |
            build/distributions/HiCT-*-darwin-arm64.run
            build/distributions/HiCT-*-darwin-arm64.tar.gz
            build/distributions/HiCT-*-darwin-arm64.sha256
          if-no-files-found: error

      - name: Save Darwin toolchain cache
        if: ${{ steps.cache-darwin-toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/darwin_arm64
          key: ${{ steps.cache-darwin-toolchains.outputs.cache-primary-key }}

      - name: Save Darwin Conan cache
        if: ${{ steps.cache-darwin-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/darwin_arm64
          key: ${{ steps.cache-darwin-conan.outputs.cache-primary-key }}

      - name: Save HiCT native processing cache
        if: ${{ steps.cache-native-processing.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: build/native-processing/resources
          key: ${{ steps.cache-native-processing.outputs.cache-primary-key }}

      - name: Validate macOS artifacts after upload
        run: |
          set -uo pipefail

          runfile="$(find build/distributions -maxdepth 1 -type f -name 'HiCT-*-darwin-arm64.run' | sort | tail -n 1)"
          portable_shell="$(find build/portable -path '*/bin/hict' -type f | sort | tail -n 1)"
          portable_bin="$(find build/portable -path '*/bin/hict-darwin-arm64' -type f | sort | tail -n 1)"
          toolchain_manifest="$(find build/portable -path '*/toolchains/darwin_arm64/manifest.json' -type f | sort | tail -n 1)"

          toolchain_dir=""
          if [[ -n "${toolchain_manifest}" ]]; then
            toolchain_dir="$(dirname "${toolchain_manifest}")"
          fi

          failed=0

          check_binary() {
            local label="$1"
            local path="$2"
            local warning_only="${3:-false}"

            if [[ -z "${path}" || ! -e "${path}" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::macOS validation: ${label} is missing at ${path}."
                return 0
              fi

              echo "::error::macOS validation: ${label} is missing at ${path}."
              return 1
            fi

            if [[ ! -x "${path}" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::macOS validation: ${label} is not executable at ${path}."
                return 0
              fi

              echo "::error::macOS validation: ${label} is not executable at ${path}."
              return 1
            fi

            echo "Testing ${label}: ${path}"

            "${path}" --help >/dev/null 2>&1
            local exit_code=$?

            if [[ "${exit_code}" != "0" ]]; then
              if [[ "${warning_only}" == "true" ]]; then
                echo "::warning::macOS validation: ${label} failed its --help smoke test with exit code ${exit_code}."
                return 0
              fi

              echo "::error::macOS validation: ${label} failed its --help smoke test with exit code ${exit_code}."
              return 1
            fi

            echo "macOS validation: ${label} passed."
            return 0
          }

          if [[ -z "${toolchain_dir}" || ! -d "${toolchain_dir}" ]]; then
            echo "::error::macOS validation: missing bundled Darwin toolchain directory after upload."
            failed=1
          fi

          check_binary "portable runfile" "${runfile}" || failed=1
          check_binary "portable shell launcher" "${portable_shell}" || failed=1
          check_binary "signed launcher" "${portable_bin}" || failed=1

          if [[ "${failed}" == "0" ]]; then
            check_binary "hictk" "${toolchain_dir}/bin/hictk" || failed=1
            check_binary "minimap2" "${toolchain_dir}/bin/minimap2" || failed=1

            # These names are SIMD-specific and may not be runnable on the current macOS runner.
            # Keep the visibility, but do not fail the whole workflow because of them.
            check_binary "mm2-plus AVX2" "${toolchain_dir}/bin/mm2plus-avx2" true || true
            check_binary "mm2-plus AVX-512" "${toolchain_dir}/bin/mm2plus-avx512" true || true
          fi

          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

          exit 0

  publish-release-assets:
    name: Publish release assets
    needs:
      - linux-portable
      - windows-portable
      - macos-portable
    if: ${{ always() && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish_target != 'artifacts-only')) }}
    runs-on: ubuntu-22.04
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloaded-artifacts

      - name: Collect assets and provenance
        shell: bash
        env:
          PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target || '' }}
          SELECTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < version.txt)"
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="latest-master"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${PUBLISH_TARGET}" == "latest-master" ]]; then
              release_tag="latest-master"
            elif [[ "${PUBLISH_TARGET}" == "release-tag" ]]; then
              release_tag="${SELECTED_RELEASE_TAG}"
              if [[ -z "${release_tag}" ]]; then
                echo "release_tag is required when publish_target=release-tag." >&2
                exit 1
              fi
            fi
          fi

          rm -rf release-dist
          mkdir -p release-dist
          while IFS= read -r -d '' file; do
            cp -f "${file}" "release-dist/$(basename "${file}")"
          done < <(
            find downloaded-artifacts -type f \( \
              -name '*.jar' -o \
              -name '*.run' -o \
              -name '*.exe' -o \
              -name '*.zip' -o \
              -name '*.tar.gz' -o \
              -name '*.sha256' \
            \) -print0
          )

          compgen -G "release-dist/*-fat.jar" >/dev/null || { echo "No fat JAR was collected." >&2; exit 1; }
          compgen -G "release-dist/HiCT-*-linux-x86_64.run" >/dev/null || { echo "No Linux .run artifact was collected." >&2; exit 1; }
          compgen -G "release-dist/HiCT-*-windows-x86_64.exe" >/dev/null || { echo "No Windows .exe artifact was collected." >&2; exit 1; }

          provenance_file="release-dist/HiCT-${version}-build-origin.txt"
          {
            echo "HiCT release build provenance"
            echo "============================="
            echo
            echo "version: ${version}"
            echo "release_tag: ${release_tag}"
            echo "trigger: ${GITHUB_EVENT_NAME}"
            echo "repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "source_ref: ${GITHUB_REF}"
            echo "source_sha: ${GITHUB_SHA}"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "bundled_refs:"
            echo "  hictk: ${HICTK_REF}"
            echo "  minimap2: ${MINIMAP2_REF}"
            echo "  mm2_plus: ${MM2PLUS_REF}"
            echo "  hict_webui: ${HICT_WEBUI_REF}"
            echo
            echo "asset_sha256:"
            (
              cd release-dist
              find . -maxdepth 1 -type f \
                ! -name "HiCT-${version}-build-origin.txt" \
                ! -name "HiCT-${version}-release-assets.sha256" \
                -printf '%P\0' |
                sort -z |
                xargs -0 sha256sum
            ) | sed 's/^/  /'
          } > "${provenance_file}"

          checksum_file="HiCT-${version}-release-assets.sha256"
          (
            cd release-dist
            rm -f "${checksum_file}"
            sha256sum * | sort -k2 > "${checksum_file}"
          )

          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          linux_run="HiCT-${version}-linux-x86_64.run"
          windows_exe="HiCT-${version}-windows-x86_64.exe"
          darwin_run="HiCT-${version}-darwin-arm64.run"
          release_body_lines=(
            "Automated HiCT portable build from \`${GITHUB_SHA}\`."
            ""
            "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            ""
            "**⚠️ For quick testing, download the exact artifact for your OS:**"
          )

          if [[ -f "release-dist/${windows_exe}" ]]; then
            release_body_lines+=("- Windows: [\`${windows_exe}\`](${release_base_url}/${windows_exe})")
          fi
          if [[ -f "release-dist/${linux_run}" ]]; then
            release_body_lines+=("- Linux: [\`${linux_run}\`](${release_base_url}/${linux_run})")
            release_body_lines+=("  After download, run \`chmod +x ${linux_run}\` and then \`bash ${linux_run}\`.")
          fi
          if [[ -f "release-dist/${darwin_run}" ]]; then
            release_body_lines+=("- macOS: [\`${darwin_run}\`](${release_base_url}/${darwin_run})")
            release_body_lines+=("  If Gatekeeper blocks the file after download, run \`xattr -d com.apple.quarantine ./HiCT-*.run\`.")
          fi

          release_body_lines+=("")
          release_body_lines+=("See \`HiCT-${version}-build-origin.txt\` and \`HiCT-${version}-release-assets.sha256\` for provenance and checksums.")
          printf '%s\n' "${release_body_lines[@]}" > release-body.md

      - name: Move latest-master tag
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-master "${GITHUB_SHA}"
          git push --force origin refs/tags/latest-master

      - name: Clear previous latest-master assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest-master >/dev/null 2>&1; then
            gh release view latest-master --json assets -q '.assets[].name' |
              while IFS= read -r asset; do
                [[ -n "${asset}" ]] && gh release delete-asset latest-master "${asset}" -y
              done
          fi

      - name: Publish latest master release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-master
          target_commitish: ${{ github.sha }}
          name: Latest master portable build
          body_path: release-body.md
          prerelease: true
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach assets to release event
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach assets to selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'release-tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
