name: Portable Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      bundle_hictk:
        description: "Build and bundle hictk before packaging"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      hictk_ref:
        description: "Official hictk tag to bundle"
        required: true
        default: "v2.2.0"
        type: string
      minimap2_ref:
        description: "Official minimap2 tag to bundle for dotplot generation"
        required: true
        default: "v2.31"
        type: string
      webui_ref:
        description: "HiCT_WebUI branch/tag/ref to bundle; use same-as-jvm to match the selected HiCT_JVM branch"
        required: true
        default: "same-as-jvm"
        type: string
      create_windows_exe:
        description: "Create portable single-file Windows EXE in addition to portable ZIP"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      windows_exe_mode:
        description: "Windows EXE packaging mode: custom cached launcher by default, or legacy official 7-Zip SFX"
        required: true
        default: "custom"
        type: choice
        options:
          - "custom"
          - "7zip-sfx"
      bundle_tauri_browser:
        description: "Build and bundle the HiCT Tauri WebView browser payload"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      bundle_electron_browser:
        description: "Build and bundle the HiCT Electron browser payload"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  linux-portable:
    name: Linux portable .run and AppImage
    runs-on: ubuntu-24.04
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
      HICTK_CONAN_HOME: ${{ github.workspace }}/.cache/hictk-conan/linux_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node.js tooling
        run: |
          node --version
          npm --version

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache HiCT native processing libraries
        uses: actions/cache@v5
        with:
          path: build/native-processing/resources
          key: hict-native-linux-x86_64-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-${{ hashFiles('build.gradle.kts', 'src/main/native/**') }}

      - name: Set up Rust
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Tauri cargo cache
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/tauri-target/linux_x86_64
          key: tauri-linux-x86_64-${{ env.HICT_WEBUI_REF }}-${{ hashFiles('scripts/portable/prepare_tauri_browser_payload_linux.sh') }}
          restore-keys: |
            tauri-linux-x86_64-${{ env.HICT_WEBUI_REF }}-
            tauri-linux-x86_64-

      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl file gzip tar xz-utils

      - name: Install Linux Tauri build prerequisites
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        run: |
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Grant execute permissions
        run: chmod +x gradlew scripts/portable/build_portable_linux.sh scripts/portable/build_appimage_linux.sh scripts/portable/prepare_tauri_browser_payload_linux.sh scripts/portable/prepare_electron_browser_payload_linux.sh scripts/toolchains/build_hictk_linux.sh scripts/toolchains/build_minimap2_linux.sh

      - name: Restore bundled toolchain cache
        id: cache-hictk
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: toolchains-dist/linux_x86_64
          key: toolchain-v2-linux-x86_64-ubuntu2404-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_linux.sh', 'scripts/toolchains/build_minimap2_linux.sh') }}
          restore-keys: |
            toolchain-v2-linux-x86_64-ubuntu2404-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-
            toolchain-linux-x86_64-ubuntu2404-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-

      - name: Inspect bundled toolchain cache
        id: inspect-toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        run: |
          manifest="toolchains-dist/linux_x86_64/manifest.json"
          hictk_ready=false
          minimap2_ready=false
          if [[ -f "${manifest}" ]]; then
            if grep -q '"hictk"' "${manifest}" && [[ -x "toolchains-dist/linux_x86_64/bin/hictk" ]]; then
              hictk_ready=true
            fi
            if grep -q '"minimap2"' "${manifest}" && [[ -x "toolchains-dist/linux_x86_64/bin/minimap2" ]]; then
              minimap2_ready=true
            fi
          fi
          echo "hictk_ready=${hictk_ready}" >> "${GITHUB_OUTPUT}"
          echo "minimap2_ready=${minimap2_ready}" >> "${GITHUB_OUTPUT}"
          echo "hictk_ready=${hictk_ready}, minimap2_ready=${minimap2_ready}"

      - name: Restore hictk Conan package cache
        id: cache-hictk-conan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/linux_x86_64
          key: hictk-conan-linux-x86_64-ubuntu2404-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_linux.sh') }}
          restore-keys: |
            hictk-conan-linux-x86_64-ubuntu2404-${{ env.HICTK_REF }}-
            hictk-conan-linux-x86_64-ubuntu2404-

      - name: Install hictk build prerequisites
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.hictk_ready != 'true' || steps.inspect-toolchain.outputs.minimap2_ready != 'true') }}
        run: |
          sudo apt-get install -y --no-install-recommends g++ gcc make cmake ninja-build python3-venv zlib1g-dev

      - name: Build bundled hictk
        id: build-hictk
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        continue-on-error: true
        env:
          ENABLE_MOSTLY_STATIC_RUNTIME: "1"
        run: ./scripts/toolchains/build_hictk_linux.sh

      - name: Build bundled minimap2
        id: build-minimap2
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.minimap2_ready != 'true' }}
        continue-on-error: true
        run: ./scripts/toolchains/build_minimap2_linux.sh

      - name: Verify bundled toolchain payload
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') }}
        run: |
          manifest="toolchains-dist/linux_x86_64/manifest.json"
          if [[ ! -f "${manifest}" ]]; then
            echo "::warning::No Linux bundled toolchain manifest was produced; hictk/minimap2 features will require external tools."
            exit 0
          fi
          if ! grep -q '"hictk"' "${manifest}"; then
            echo "::warning::Linux bundled hictk was not built or restored; .hic conversion will require external hictk."
          elif [[ ! -x "toolchains-dist/linux_x86_64/bin/hictk" ]]; then
            echo "::warning::Linux bundled hictk is listed in the manifest but bin/hictk is missing or not executable."
          else
            toolchains-dist/linux_x86_64/bin/hictk --version
          fi
          if ! grep -q '"minimap2"' "${manifest}"; then
            echo "::warning::Linux bundled minimap2 was not built or restored; dotplot generation will require external minimap2."
          elif [[ ! -x "toolchains-dist/linux_x86_64/bin/minimap2" ]]; then
            echo "::warning::Linux bundled minimap2 is listed in the manifest but bin/minimap2 is missing or not executable."
          else
            toolchains-dist/linux_x86_64/bin/minimap2 --version
          fi

      - name: Save hictk Conan package cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' && steps.cache-hictk-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/linux_x86_64
          key: ${{ steps.cache-hictk-conan.outputs.cache-primary-key }}

      - name: Save bundled toolchain cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.hictk_ready != 'true' || steps.inspect-toolchain.outputs.minimap2_ready != 'true') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/linux_x86_64
          key: ${{ steps.cache-hictk.outputs.cache-primary-key }}

      - name: Build bundled Tauri browser
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}/..
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/tauri-target/linux_x86_64
        run: ./scripts/portable/prepare_tauri_browser_payload_linux.sh

      - name: Build bundled Electron browser
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_electron_browser == 'true' }}
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}/..
        run: ./scripts/portable/prepare_electron_browser_payload_linux.sh

      - name: Build Linux portable package
        run: ./scripts/portable/build_portable_linux.sh

      - name: Build Linux AppImage
        env:
          HICT_SKIP_PORTABLE: "1"
        run: ./scripts/portable/build_appimage_linux.sh

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-linux-portable
          path: |
            build/distributions/HiCT-*-linux-x86_64.run
            build/distributions/HiCT-*-linux-x86_64.tar.gz
            build/distributions/HiCT-*-linux-x86_64.sha256
            build/distributions/HiCT-*-x86_64.AppImage
            build/distributions/HiCT-*-x86_64.AppImage.sha256

      - name: Upload Linux runfile artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-linux-runfile
          path: |
            build/distributions/HiCT-*-linux-x86_64.run
            build/distributions/HiCT-*-linux-x86_64.sha256

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-linux-appimage
          path: |
            build/distributions/HiCT-*-x86_64.AppImage
            build/distributions/HiCT-*-x86_64.AppImage.sha256

      - name: Attach Linux package to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/HiCT-*-linux-x86_64.run
            build/distributions/HiCT-*-linux-x86_64.tar.gz
            build/distributions/HiCT-*-linux-x86_64.sha256
            build/distributions/HiCT-*-x86_64.AppImage
            build/distributions/HiCT-*-x86_64.AppImage.sha256

  windows-portable:
    name: Windows portable ZIP and EXE
    runs-on: windows-2022
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
      HICTK_CONAN_HOME: ${{ github.workspace }}\.cache\hictk-conan\windows_x86_64
      HICT_WINDOWS_EXE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_exe_mode || 'custom' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node.js tooling
        shell: pwsh
        run: |
          node --version
          npm.cmd --version

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache HiCT native processing libraries
        uses: actions/cache@v5
        with:
          path: build/native-processing/resources
          key: hict-native-windows-x86_64-openmp-${{ env.HICT_NATIVE_OPENMP || '0' }}-${{ hashFiles('build.gradle.kts', 'src/main/native/**') }}

      - name: Set up Rust
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Tauri cargo cache
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/tauri-target/windows_x86_64
          key: tauri-windows-x86_64-${{ env.HICT_WEBUI_REF }}-${{ hashFiles('scripts/portable/prepare_tauri_browser_payload_windows.ps1') }}
          restore-keys: |
            tauri-windows-x86_64-${{ env.HICT_WEBUI_REF }}-
            tauri-windows-x86_64-

      - name: Restore bundled toolchain cache
        id: cache-hictk
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: toolchains-dist/windows_x86_64
          key: toolchain-v2-windows-x86_64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_windows.ps1', 'scripts/toolchains/build_minimap2_windows.ps1') }}
          restore-keys: |
            toolchain-v2-windows-x86_64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-
            toolchain-windows-x86_64-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-

      - name: Inspect bundled toolchain cache
        id: inspect-toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        shell: pwsh
        run: |
          $manifest = "toolchains-dist\windows_x86_64\manifest.json"
          $hictkReady = "false"
          $minimap2Ready = "false"
          if (Test-Path $manifest) {
            $manifestText = Get-Content -Raw $manifest
            if ($manifestText -match '"hictk"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\hictk.exe")) {
              $hictkReady = "true"
            }
            if ($manifestText -match '"minimap2"' -and (Test-Path "toolchains-dist\windows_x86_64\bin\minimap2.exe")) {
              $minimap2Ready = "true"
            }
          }
          "hictk_ready=$hictkReady" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "minimap2_ready=$minimap2Ready" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "hictk_ready=$hictkReady, minimap2_ready=$minimap2Ready"

      - name: Restore hictk Conan package cache
        id: cache-hictk-conan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/windows_x86_64
          key: hictk-conan-windows-x86_64-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_hictk_windows.ps1') }}
          restore-keys: |
            hictk-conan-windows-x86_64-${{ env.HICTK_REF }}-
            hictk-conan-windows-x86_64-

      - name: Configure MSVC environment
        if: ${{ ((github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true') || (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true' && inputs.windows_exe_mode == 'custom')) }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found. Visual Studio Build Tools are required for hictk/custom EXE builds."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "No Visual Studio installation with MSVC x64 tools was found."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at $vcvars."
          }

          $env:VSCMD_SKIP_SENDTELEMETRY = "1"
          $envDump = cmd.exe /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed with exit code $LASTEXITCODE."
          }

          $namesToExport = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          @(
            "Path",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "EXTERNAL_INCLUDE",
            "CommandPromptType",
            "DevEnvDir",
            "ExtensionSdkDir",
            "FrameworkDir",
            "FrameworkDir64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "IFCPATH",
            "NETFXSDKDir",
            "Platform",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCPKG_ROOT",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSdkVerBinPath",
            "WindowsSDKVersion"
          ) | ForEach-Object { [void]$namesToExport.Add($_) }

          foreach ($line in $envDump) {
            $separator = $line.IndexOf("=")
            if ($separator -le 0) {
              continue
            }
            $name = $line.Substring(0, $separator)
            if (-not $namesToExport.Contains($name)) {
              continue
            }
            $value = $line.Substring($separator + 1)
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build bundled hictk
        id: build-hictk
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' }}
        continue-on-error: true
        shell: pwsh
        run: .\scripts\toolchains\build_hictk_windows.ps1 -MostlyStaticRuntime

      - name: Build bundled minimap2
        id: build-minimap2
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.minimap2_ready != 'true' }}
        continue-on-error: true
        shell: pwsh
        run: .\scripts\toolchains\build_minimap2_windows.ps1

      - name: Verify bundled toolchain payload
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') }}
        shell: pwsh
        run: |
          $manifest = "toolchains-dist\windows_x86_64\manifest.json"
          if (-not (Test-Path $manifest)) {
            Write-Host "::warning::No Windows bundled toolchain manifest was produced; hictk/minimap2 features will require external tools."
            exit 0
          }
          $manifestText = Get-Content -Raw $manifest
          if ($manifestText -notmatch '"hictk"') {
            Write-Host "::warning::Windows bundled hictk was not built or restored; .hic conversion will require external hictk."
          } elseif (-not (Test-Path "toolchains-dist\windows_x86_64\bin\hictk.exe")) {
            Write-Host "::warning::Windows bundled hictk is listed in the manifest but bin\hictk.exe is missing."
          } else {
            & "toolchains-dist\windows_x86_64\bin\hictk.exe" --version
          }
          if ($manifestText -notmatch '"minimap2"') {
            Write-Host "::warning::Windows bundled minimap2 was not built or restored; dotplot generation will require external minimap2."
          } elseif (-not (Test-Path "toolchains-dist\windows_x86_64\bin\minimap2.exe")) {
            Write-Host "::warning::Windows bundled minimap2 is listed in the manifest but bin\minimap2.exe is missing."
          } else {
            & "toolchains-dist\windows_x86_64\bin\minimap2.exe" --version
          }

      - name: Save hictk Conan package cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && steps.inspect-toolchain.outputs.hictk_ready != 'true' && steps.cache-hictk-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/windows_x86_64
          key: ${{ steps.cache-hictk-conan.outputs.cache-primary-key }}

      - name: Save bundled toolchain cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true') && (steps.inspect-toolchain.outputs.hictk_ready != 'true' || steps.inspect-toolchain.outputs.minimap2_ready != 'true') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/windows_x86_64
          key: ${{ steps.cache-hictk.outputs.cache-primary-key }}

      - name: Install 7-Zip for portable EXE
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        shell: pwsh
        run: choco install 7zip.install -y --no-progress

      - name: Build bundled Tauri browser
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        shell: pwsh
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}\..
          CARGO_TARGET_DIR: ${{ github.workspace }}\.cache\tauri-target\windows_x86_64
        run: .\scripts\portable\prepare_tauri_browser_payload_windows.ps1

      - name: Build bundled Electron browser
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_electron_browser == 'true' }}
        shell: pwsh
        env:
          HICT_BROWSER_BUILD_ROOT: ${{ github.workspace }}\..
        run: .\scripts\portable\prepare_electron_browser_payload_windows.ps1

      - name: Build Windows portable package and EXE
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        shell: pwsh
        run: .\scripts\portable\build_portable_windows.ps1 -CreateSelfExtractingExe -WindowsExeMode $env:HICT_WINDOWS_EXE_MODE

      - name: Build Windows portable package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_windows_exe != 'true' }}
        shell: pwsh
        run: .\scripts\portable\build_portable_windows.ps1

      - name: Stop Gradle daemons
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path ".\gradlew.bat") {
            .\gradlew.bat --stop
          }
        continue-on-error: true

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-windows-portable
          path: |
            build/distributions/HiCT-*-windows-x86_64-portable.zip
            build/distributions/HiCT-*-windows-x86_64.exe
            build/distributions/HiCT-*-windows-x86_64.sha256

      - name: Upload Windows EXE artifact
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_windows_exe == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: hict-windows-exe
          path: |
            build/distributions/HiCT-*-windows-x86_64.exe
            build/distributions/HiCT-*-windows-x86_64.sha256

      - name: Attach Windows package to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/HiCT-*-windows-x86_64-portable.zip
            build/distributions/HiCT-*-windows-x86_64.exe
            build/distributions/HiCT-*-windows-x86_64.sha256
