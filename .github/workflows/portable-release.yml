        run: python -c "import shutil; shutil.rmtree('build/native-processing/resources', ignore_errors=True)"

      - name: Grant execute permissions
        run: chmod +x gradlew scripts/portable/build_portable_darwin_arm64.sh scripts/portable/build_portable_darwin_x86_64.sh scripts/portable/prepare_tauri_browser_payload_darwin.sh scripts/toolchains/build_darwin_toolchains.sh
      - name: Prepare macOS Intel Tauri browser payload
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/tauri-target/darwin_x86_64
          HICT_BROWSER_PLATFORM: darwin_x86_64
        run: ./scripts/portable/prepare_tauri_browser_payload_darwin.sh
      - name: Restore Darwin Intel toolchain cache
        id: cache-darwin-toolchains
        uses: actions/cache/restore@v5
        with:
          path: |
            toolchains-dist/darwin_x86_64/bin
            toolchains-dist/darwin_x86_64/share
          key: toolchain-v3-darwin-x86_64-min-${{ env.MACOSX_DEPLOYMENT_TARGET }}-hictk-${{ env.HICTK_REF }}-minimap2-${{ env.MINIMAP2_REF }}-mm2plus-${{ env.MM2PLUS_REF }}-${{ hashFiles('scripts/toolchains/build_darwin_toolchains.sh', 'scripts/toolchains/conan-git/git', 'scripts/portable/macos_target.sh') }}-${{ steps.runner-image.outputs.identity }}-${{ steps.tool-sources.outputs.sources }}
      - name: Discard non-exact compiled cache
        if: steps.cache-darwin-toolchains.outputs.cache-hit != 'true'
        shell: bash
        run: python -c "import shutil; shutil.rmtree('toolchains-dist/darwin_x86_64', ignore_errors=True)"

      - name: Restore Darwin Intel Conan cache
        id: cache-darwin-conan
        uses: actions/cache/restore@v5
        with:
          path: .cache/hictk-conan/darwin_x86_64
          key: hictk-conan-v3-darwin-x86_64-min-${{ env.MACOSX_DEPLOYMENT_TARGET }}-explicit-profile-${{ env.HICTK_REF }}-${{ hashFiles('scripts/toolchains/build_darwin_toolchains.sh', 'scripts/toolchains/conan-git/git') }}
          restore-keys: |
            hictk-conan-v3-darwin-x86_64-min-${{ env.MACOSX_DEPLOYMENT_TARGET }}-explicit-profile-${{ env.HICTK_REF }}-
            hictk-conan-v3-darwin-x86_64-min-${{ env.MACOSX_DEPLOYMENT_TARGET }}-explicit-profile-
      - name: Download verified sequence tools
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: sequence-tools-darwin_x86_64
          path: sequence-tools-archive
      - name: Extract sequence tools
        shell: bash
        run: |
          mkdir -p sequence-tools-dist
          tar -xzf sequence-tools-archive/sequence-tools-darwin_x86_64.tar.gz -C sequence-tools-dist

      - name: Build macOS Intel portable package
        run: ./scripts/portable/build_portable_darwin_x86_64.sh
      - name: Preserve macOS Intel compatibility audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: macos-x86_64-compatibility
          path: build/portable/**/share/doc/macos-compatibility.json
      - name: Verify every bundled tool in the packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          jar_path="build/libs/hict_server-${version}-fat.jar"
          python scripts/toolchains/verify_packaged_tools.py --jar "$jar_path"

      - name: Upload macOS Intel HiCT native processing artifact
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: hict-native-darwin-x86_64
          path: build/native-processing/resources
          if-no-files-found: error
      - name: Upload macOS Intel hictk artifact
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: hictk-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/hictk
            toolchains-dist/darwin_x86_64/share/licenses/hictk/**
            toolchains-dist/darwin_x86_64/share/doc/hictk/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel minimap2 artifact
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: minimap2-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/minimap2
            toolchains-dist/darwin_x86_64/share/licenses/minimap2/**
            toolchains-dist/darwin_x86_64/share/doc/minimap2/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel mm2-plus artifact
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: mm2-plus-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/mm2plus*
            toolchains-dist/darwin_x86_64/share/licenses/mm2plus/**
            toolchains-dist/darwin_x86_64/share/doc/mm2plus/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel browser artifact
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle_tauri_browser == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          overwrite: ${{ github.run_attempt != '1' }}
          name: browser-tauri-darwin-x86_64
          path: browsers-dist/darwin_x86_64
          if-no-files-found: error
      - name: Upload macOS Intel package artifact
        uses: ./.github/actions/upload-release-artifact
        with:
          name: hict-darwin-x86_64-portable
          path: |
            build/distributions/HiCT-${{ env.HICT_BUILD_VERSION }}-darwin-x86_64.run
            build/distributions/HiCT-${{ env.HICT_BUILD_VERSION }}-darwin-x86_64.tar.gz
            build/distributions/HiCT-${{ env.HICT_BUILD_VERSION }}-darwin-x86_64.sha256
      - name: Validate macOS Intel artifacts (post-upload)
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          root="${HICT_PORTABLE_DIST_DIR:-build/portable}/HiCT-${version}-darwin-x86_64"
          runfile="build/distributions/HiCT-${version}-darwin-x86_64.run"
          launcher="${root}/bin/hict-darwin-x86_64"
          shell_launcher="${root}/bin/hict"
          [[ -d build/native-processing/resources/natives/macos_64 ]] || { echo "::error::Missing macOS Intel native processing payload."; exit 1; }
          find build/native-processing/resources/natives/macos_64 -path '*/native/*.dylib' -type f -print -quit | grep -q . || { echo "::error::No macOS Intel native processing dylibs found."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/hictk ]] || { echo "::error::Missing macOS Intel hictk."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/minimap2 ]] || { echo "::error::Missing macOS Intel minimap2."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/mm2plus-avx2 ]] || { echo "::error::Missing macOS Intel mm2-plus AVX2 entrypoint."; exit 1; }
          toolchains-dist/darwin_x86_64/bin/hictk --help >/dev/null
          toolchains-dist/darwin_x86_64/bin/minimap2 --help >/dev/null || true
          toolchains-dist/darwin_x86_64/bin/mm2plus-avx2 --help >/dev/null || true
          [[ -n "${runfile}" && -f "${runfile}" ]] || { echo "::error::Missing macOS Intel runfile."; exit 1; }
          [[ -n "${launcher}" && -x "${launcher}" ]] || { echo "::error::Missing signed macOS Intel launcher."; exit 1; }
          [[ -n "${shell_launcher}" && -x "${shell_launcher}" ]] || { echo "::error::Missing macOS shell launcher."; exit 1; }
          codesign -dv --verbose=2 "${launcher}" 2>&1 || { echo "::error::macOS Intel launcher is not ad-hoc signed."; exit 1; }
          "${launcher}" --help >/dev/null
          "${launcher}" check-toolchains --require-hictk --require-dotplot
          if [[ -d browsers-dist/darwin_x86_64 ]]; then
            [[ -f browsers-dist/darwin_x86_64/tauri/manifest.json ]] || { echo "::error::Missing macOS Intel Tauri browser manifest."; exit 1; }
            [[ -x browsers-dist/darwin_x86_64/tauri/bin/hict-tauri-browser ]] || { echo "::error::Missing macOS Intel Tauri browser executable."; exit 1; }
            [[ -f "$(dirname "${launcher}")/../browsers/darwin_x86_64/tauri/manifest.json" ]] || { echo "::error::Packaged macOS Intel app is missing Tauri browser payload."; exit 1; }
            codesign -dv --verbose=2 "$(dirname "${launcher}")/../browsers/darwin_x86_64/tauri/bin/hict-tauri-browser" 2>&1 || { echo "::error::Packaged macOS Intel Tauri browser is not ad-hoc signed."; exit 1; }
          fi
      - name: Verify upstream sources stayed fixed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_hictk == 'true' }}
        shell: bash
        run: python scripts/ci/toolchain_cache_sources.py --verify
      - name: Save Darwin Intel toolchain cache
        if: ${{ success() && steps.cache-darwin-toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            toolchains-dist/darwin_x86_64/bin
            toolchains-dist/darwin_x86_64/share
          key: ${{ steps.cache-darwin-toolchains.outputs.cache-primary-key }}
      - name: Save Darwin Intel Conan cache
        if: ${{ success() && steps.cache-darwin-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/darwin_x86_64
          key: ${{ steps.cache-darwin-conan.outputs.cache-primary-key }}
      - name: Save HiCT native processing cache
        if: ${{ success() && steps.cache-native-processing.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: build/native-processing/resources
          key: ${{ steps.cache-native-processing.outputs.cache-primary-key }}
      - name: Report macOS Intel failure
        if: ${{ failure() }}
        run: echo "::error::macOS Intel build failed; publication is blocked."

  # Source/JNI checks are independent of package artifacts; start them immediately.
  # Publication below continues to require both their success and all four packages.
  regression-gate:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_before_tests) }}
    uses: ./.github/workflows/java-regressions.yml

  regression-after-early-publication:
    needs: [linux-portable, windows-portable, macos-portable, macos-intel-portable]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_before_tests }}
    uses: ./.github/workflows/java-regressions.yml

  # Fix branches validate and upload artifacts on push without mutating releases.
  publish-release-assets:
    name: Publish release assets
    needs:
      - resolve-webui
      - regression-gate
      - linux-portable
      - windows-portable
      - macos-portable
      - macos-intel-portable
    if: ${{ always() && needs.linux-portable.result == 'success' && needs.windows-portable.result == 'success' && needs.macos-portable.result == 'success' && needs.macos-intel-portable.result == 'success' && (needs.regression-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.publish_before_tests)) && (github.event_name == 'release' || (github.event_name == 'push' && !startsWith(github.ref_name, 'fix/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_target != 'artifacts-only')) }}
    runs-on: ubuntu-22.04
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ needs.resolve-webui.outputs.commit }}
      HICT_EXPECTED_TOOLCHAIN_SOURCES: ${{ needs.resolve-webui.outputs.toolchain_sources }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tested WebUI against the release source
        run: test "${HICT_WEBUI_REF}" = "$(cat webui-revision.txt)"

      - name: Assign run-specific release version
        run: |
          python scripts/ci/test_release_version.py
          python scripts/ci/set_release_version.py --github-env

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: downloaded-artifacts
          pattern: '{hict-jvm-fat-jar,hict-linux-portable*,hict-linux-appimage*,hict-windows-portable,hict-darwin-*-portable}'

      - name: Collect assets and provenance
        id: collect-assets
        shell: bash
        env:
          PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target || '' }}
          SELECTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          PUBLISH_LINUX_APPIMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_appimage == 'true' }}
          PUBLISH_WINDOWS_EXE: ${{ github.event_name != 'workflow_dispatch' || inputs.create_windows_exe == 'true' }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < version.txt)"
          default_latest_tag="latest-${GITHUB_REF_NAME}"
          release_tag="${GITHUB_REF_NAME}"
          rolling_release="false"
          versioned_branch_release="false"
          release_channel="${GITHUB_REF_NAME}"
          if [[ "${release_channel}" == "master" ]]; then release_channel="main"; fi
          if [[ ( "${release_channel}" == "jvm-sfx-native" || "${release_channel}" == "main" ) &&
                ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) ]]; then
            release_tag="${release_channel}-${version}"
            versioned_branch_release="true"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
                  ( ( "${PUBLISH_TARGET}" != "release-tag" &&
                      ! ( "${PUBLISH_TARGET}" == "latest-master" && "${release_channel}" == "main" ) ) ||
                    ( -n "${SELECTED_RELEASE_TAG}" && "${SELECTED_RELEASE_TAG}" != "${release_tag}" ) ) ]]; then
              echo "::error::Publish a channel build with release_tag empty for the run-specific tag." >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${default_latest_tag}"
            rolling_release="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${PUBLISH_TARGET}" == "latest-master" ]]; then
              release_tag="latest-master"
              rolling_release="true"
            elif [[ "${PUBLISH_TARGET}" == "release-tag" ]]; then
              release_tag="${SELECTED_RELEASE_TAG:-${default_latest_tag}}"
              if [[ -z "${release_tag}" ]]; then
                echo "release_tag is required when publish_target=release-tag." >&2
                exit 1
              fi
              if [[ -z "${SELECTED_RELEASE_TAG}" ]]; then
                rolling_release="true"
              fi
            fi
          fi
          if [[ "${versioned_branch_release}" != "true" &&
                ( "${release_tag}" == "latest-jvm-sfx-native" || "${release_tag}" == jvm-sfx-native-* ||
                  "${release_tag}" == "latest-master" || "${release_tag}" == main-* ) ]]; then
            echo "::error::This tag belongs to a managed channel. Run the workflow on the matching branch." >&2
            exit 1
          fi
          git check-ref-format "refs/tags/${release_tag}"
          {
            echo "HICT_PORTABLE_RELEASE_TAG=${release_tag}"
            echo "HICT_PORTABLE_ROLLING_RELEASE=${rolling_release}"
            echo "HICT_RELEASE_CHANNEL=${release_channel}"
          } >> "${GITHUB_ENV}"
          {
            echo "release_tag=${release_tag}"
            echo "rolling_release=${rolling_release}"
            echo "versioned_branch_release=${versioned_branch_release}"
          } >> "${GITHUB_OUTPUT}"

          rm -rf release-dist
          mkdir -p release-dist
          while IFS= read -r -d '' file; do
            cp -f "${file}" "release-dist/$(basename "${file}")"
          done < <(
            find downloaded-artifacts -type f \( -name "HiCT-${version}-*" -o -name "hict_server-${version}-fat.jar" \) \( \
              -name '*.jar' -o \
              -name '*.run' -o \
              -name '*.AppImage' -o \
              -name '*.exe' -o \
              -name '*.zip' -o \
              -name '*.tar.gz' -o \
              -name '*.sha256' \
            \) -print0
          )
          required_assets=(
            "hict_server-${version}-fat.jar"
            "HiCT-${version}-linux-x86_64.run"
            "HiCT-${version}-linux-x86_64.tar.gz"
            "HiCT-${version}-linux-x86_64.sha256"
            "HiCT-${version}-windows-x86_64-portable.zip"
            "HiCT-${version}-windows-x86_64.sha256"
            "HiCT-${version}-darwin-arm64.run"
            "HiCT-${version}-darwin-arm64.tar.gz"
            "HiCT-${version}-darwin-arm64.sha256"
            "HiCT-${version}-darwin-x86_64.run"
            "HiCT-${version}-darwin-x86_64.tar.gz"
            "HiCT-${version}-darwin-x86_64.sha256"
          )
          if [[ "${PUBLISH_LINUX_APPIMAGE}" == "true" ]]; then
            required_assets+=("HiCT-${version}-x86_64.AppImage" "HiCT-${version}-x86_64.AppImage.sha256")
          fi
          if [[ "${PUBLISH_WINDOWS_EXE}" == "true" ]]; then
            required_assets+=("HiCT-${version}-windows-x86_64.exe")
          fi
          for asset in "${required_assets[@]}"; do
            [[ -s "release-dist/${asset}" ]] || {
              echo "::error::Missing required package ${asset}."
              exit 1
            }
          done

          # Hash each package once for both provenance and the release manifest.
          (
            cd release-dist
            find . -maxdepth 1 -type f -printf '%P\0' | sort -z | xargs -0 sha256sum
          ) > release-asset-digests.txt
          python3 - <<'PY'
          from pathlib import Path

          def checksums(path):
              entries = {}
              for line in path.read_text(encoding="utf-8-sig").splitlines():
                  digest, name = line.split(maxsplit=1)
                  if name in entries:
                      raise SystemExit(f"Duplicate asset {name} in {path}")
                  entries[name] = digest
              return entries

          actual = checksums(Path("release-asset-digests.txt"))
          for manifest in Path("release-dist").glob("*.sha256"):
              base = manifest.stem
              if base.endswith(".AppImage"):
                  expected = {base}
              elif base.endswith("-windows-x86_64"):
                  expected = {f"{base}-portable.zip"}
                  if f"{base}.exe" in actual:
                      expected.add(f"{base}.exe")
              else:
                  expected = {f"{base}.run", f"{base}.tar.gz"}
              reported = checksums(manifest)
              if set(reported) != expected or any(actual.get(name) != reported[name] for name in reported):
                  raise SystemExit(f"Package checksum mismatch in {manifest.name}")
          PY

          provenance_file="release-dist/HiCT-${version}-build-origin.txt"
          {
            echo "HiCT release build provenance"
            echo "============================="
            echo
            echo "version: ${version}"
            echo "release_tag: ${release_tag}"
            echo "trigger: ${GITHUB_EVENT_NAME}"
            echo "repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "source_ref: ${GITHUB_REF}"
            echo "source_sha: ${GITHUB_SHA}"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "bundled_refs:"
            echo "  hictk: ${HICTK_REF}"
            echo "  minimap2: ${MINIMAP2_REF}"
            echo "  mm2_plus: ${MM2PLUS_REF}"
            echo "  hict_webui: ${HICT_WEBUI_REF}"
            echo "  native_sources_sha256: ${HICT_EXPECTED_TOOLCHAIN_SOURCES}"
            echo
            echo "asset_sha256:"
            sed 's/^/  /' release-asset-digests.txt
          } > "${provenance_file}"

          checksum_file="HiCT-${version}-release-assets.sha256"
          (
            cd release-dist
            { cat ../release-asset-digests.txt; sha256sum "$(basename "${provenance_file}")"; } |
              sort -k2 > "${checksum_file}"
          )

          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          linux_run="HiCT-${version}-linux-x86_64.run"
          linux_appimage="HiCT-${version}-x86_64.AppImage"
          windows_exe="HiCT-${version}-windows-x86_64.exe"
          darwin_arm64_run="HiCT-${version}-darwin-arm64.run"
          darwin_x86_64_run="HiCT-${version}-darwin-x86_64.run"
          release_body_lines=(
            "Automated HiCT portable build from \`${GITHUB_SHA}\`."
            ""
            "[Latest Main build](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-master) · [Latest Development build](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-jvm-sfx-native)"
            ""
            "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            ""
            "**⚠️ For quick testing, download the exact artifact for your OS:**"
          )

          if [[ -f "release-dist/${windows_exe}" ]]; then
            release_body_lines+=("- Windows: [\`${windows_exe}\`](${release_base_url}/${windows_exe})")
          fi
          if [[ -f "release-dist/${linux_run}" ]]; then
            release_body_lines+=("- Linux: [\`${linux_run}\`](${release_base_url}/${linux_run})")
            release_body_lines+=("  Recommended for most desktop/server Linux systems such as Ubuntu, Debian, Fedora, RHEL, CentOS, openSUSE, Arch, and similar glibc-based distributions. It caches the extracted program next to the downloaded file, so repeated starts usually do less unpacking.")
            release_body_lines+=("  Run it with: \`chmod +x ${linux_run}\` and then \`bash ${linux_run}\`.")
          fi
          if [[ -f "release-dist/${linux_appimage}" ]]; then
            release_body_lines+=("- Linux AppImage: [\`${linux_appimage}\`](${release_base_url}/${linux_appimage})")
            release_body_lines+=("  Use this when the Linux runfile does not start, or on older/minimal Linux systems such as manylinux2010-like environments and Alpine/musl containers. On normal desktop Linux it uses the system loader; if that cannot start the bundled Java runtime, it falls back to its included glibc/ld-linux runtime.")
            release_body_lines+=("  Run it with: \`chmod +x ${linux_appimage}\` and then \`./${linux_appimage}\`.")
            release_body_lines+=("  If the AppImage reports a FUSE or mount error, run: \`APPIMAGE_EXTRACT_AND_RUN=1 ./${linux_appimage}\`. This mode is more compatible but may unpack the application to a temporary directory each time.")
          fi
          if [[ -f "release-dist/${linux_run}" || -f "release-dist/${linux_appimage}" ]]; then
            release_body_lines+=("")
            release_body_lines+=("Linux choice summary:")
            release_body_lines+=("- Start with the \`.run\` file on normal Linux installations.")
            release_body_lines+=("- Use the AppImage for older systems, Alpine/musl, containers, or if the \`.run\` file reports a glibc/runtime error.")
            release_body_lines+=("- Both Linux packages can start the server from the command line, for example: \`start-server\` or \`start-server --help\` after the artifact name.")
            release_body_lines+=("- For a remote SSH cluster, forward both ports from your local computer: \`ssh -L 8080:127.0.0.1:8080 -L 5000:127.0.0.1:5000 user@cluster.example.org\`, then run HiCT on the remote machine with \`start-server\` and open \`http://localhost:8080\` locally.")
          fi
          darwin_assets=()
          if [[ -f "release-dist/${darwin_arm64_run}" ]]; then
            darwin_assets+=("[\`${darwin_arm64_run}\`](${release_base_url}/${darwin_arm64_run})")
          fi
          if [[ -f "release-dist/${darwin_x86_64_run}" ]]; then
            darwin_assets+=("[\`${darwin_x86_64_run}\`](${release_base_url}/${darwin_x86_64_run})")
          fi
          if [[ ${#darwin_assets[@]} -gt 0 ]]; then
            release_body_lines+=("- macOS: ${darwin_assets[*]}")
            release_body_lines+=("  These are Terminal-run \`.run\` files, not \`.dmg\` installers. There is no application icon to drag into Applications.")
            release_body_lines+=("  Open Terminal, go to the download folder, run \`xattr -d com.apple.quarantine ./HiCT-*.run\` if macOS blocks the file, then run \`chmod +x ./HiCT-*.run\` and \`./HiCT-*.run\`.")
          else
            echo "::warning::No macOS portable artifacts were collected; publishing Windows/Linux release only."
          fi

          release_body_lines+=("")
          release_body_lines+=("See \`HiCT-${version}-build-origin.txt\` and \`HiCT-${version}-release-assets.sha256\` for provenance and checksums.")
          printf '%s\n' "${release_body_lines[@]}" > release-body.md

      - name: Check rolling release publication safeguards
        run: node --test scripts/ci/rolling_release.test.cjs

      - name: Inspect rolling release without deleting assets
        id: rolling-release
        if: ${{ steps.collect-assets.outputs.rolling_release == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { prepare } = require('./scripts/ci/rolling_release.cjs');
            await prepare({ github, context, core, tag: process.env.HICT_PORTABLE_RELEASE_TAG });

      - name: Publish rolling release
        if: ${{ steps.collect-assets.outputs.rolling_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect-assets.outputs.release_tag }}
          target_commitish: ${{ steps.rolling-release.outputs.target_commitish }}
          name: Latest ${{ github.ref_name }} portable build
          body_path: release-body.md
          prerelease: true
          files: release-dist/*
          fail_on_unmatched_files: true
          # Never delete an existing same-name download before its replacement
          # uploads. The following step verifies skipped files by SHA-256 too.
          overwrite_files: false

      - name: Verify rolling upload
        if: ${{ success() && steps.collect-assets.outputs.rolling_release == 'true' }}
        uses: actions/github-script@v8
        env:
          HICT_PREVIOUS_RELEASE_ID: ${{ steps.rolling-release.outputs.release_id }}
        with:
          script: |
            const { verifyAssets } = require('./scripts/ci/rolling_release.cjs');
            await verifyAssets({ github, context, tag: process.env.HICT_PORTABLE_RELEASE_TAG,
              releaseId: process.env.HICT_PREVIOUS_RELEASE_ID,
              directory: 'release-dist' });

      - name: Attach assets to release event
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Ensure the versioned channel tag points to the build
        if: ${{ steps.collect-assets.outputs.versioned_branch_release == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { ensureVersionedTarget } = require('./scripts/ci/rolling_release.cjs');
            await ensureVersionedTarget({
              github, context, tag: process.env.HICT_PORTABLE_RELEASE_TAG,
            });

      - name: Publish versioned channel release
        if: ${{ steps.collect-assets.outputs.versioned_branch_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          python scripts/ci/test_publish_versioned_release.py
          python scripts/ci/publish_versioned_release.py --directory release-dist --notes release-body.md

      - name: Verify versioned channel assets
        if: ${{ steps.collect-assets.outputs.versioned_branch_release == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { verifyAssets, verifyVersionedTarget } = require('./scripts/ci/rolling_release.cjs');
            const tag = process.env.HICT_PORTABLE_RELEASE_TAG;
            await verifyVersionedTarget({ github, context, tag });
            await verifyAssets({ github, context, tag, directory: 'release-dist', exact: true });

      - name: Refresh the channel download links
        if: ${{ steps.collect-assets.outputs.versioned_branch_release == 'true' && (github.event_name != 'workflow_dispatch' || (inputs.build_linux_appimage && inputs.create_windows_exe)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          python scripts/ci/update_branch_release_index.py --repo "$GITHUB_REPOSITORY" \
            --channel "$HICT_RELEASE_CHANNEL" --tag "$HICT_PORTABLE_RELEASE_TAG" --version "$HICT_BUILD_VERSION"

      - name: Attach assets to selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'release-tag' && inputs.release_tag != '' && steps.collect-assets.outputs.versioned_branch_release == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: false
