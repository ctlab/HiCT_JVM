        run: ./scripts/portable/build_portable_darwin_x86_64.sh
      - name: Upload macOS Intel HiCT native processing artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-native-darwin-x86_64
          path: build/native-processing/resources
          if-no-files-found: error
      - name: Upload macOS Intel hictk artifact
        uses: actions/upload-artifact@v6
        with:
          name: hictk-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/hictk
            toolchains-dist/darwin_x86_64/share/licenses/hictk/**
            toolchains-dist/darwin_x86_64/share/doc/hictk/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel minimap2 artifact
        uses: actions/upload-artifact@v6
        with:
          name: minimap2-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/minimap2
            toolchains-dist/darwin_x86_64/share/licenses/minimap2/**
            toolchains-dist/darwin_x86_64/share/doc/minimap2/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel mm2-plus artifact
        uses: actions/upload-artifact@v6
        with:
          name: mm2-plus-darwin-x86_64
          path: |
            toolchains-dist/darwin_x86_64/bin/mm2plus*
            toolchains-dist/darwin_x86_64/share/licenses/mm2plus/**
            toolchains-dist/darwin_x86_64/share/doc/mm2plus/**
            toolchains-dist/darwin_x86_64/manifest.json
          if-no-files-found: error
      - name: Upload macOS Intel package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-darwin-x86_64-portable
          path: |
            build/distributions/HiCT-*-darwin-x86_64.run
            build/distributions/HiCT-*-darwin-x86_64.tar.gz
            build/distributions/HiCT-*-darwin-x86_64.sha256
          if-no-files-found: error
      - name: Validate macOS Intel artifacts (post-upload)
        run: |
          set -euo pipefail
          runfile="$(find build/distributions -maxdepth 1 -type f -name 'HiCT-*-darwin-x86_64.run' | sort | tail -n 1)"
          launcher="$(find build/portable -path '*/bin/hict-darwin-x86_64' -type f | sort | tail -n 1)"
          shell_launcher="$(find build/portable -path '*/bin/hict' -type f | sort | tail -n 1)"
          [[ -d build/native-processing/resources/natives/macos_64 ]] || { echo "::error::Missing macOS Intel native processing payload."; exit 1; }
          find build/native-processing/resources/natives/macos_64 -path '*/native/*.dylib' -type f -print -quit | grep -q . || { echo "::error::No macOS Intel native processing dylibs found."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/hictk ]] || { echo "::error::Missing macOS Intel hictk."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/minimap2 ]] || { echo "::error::Missing macOS Intel minimap2."; exit 1; }
          [[ -x toolchains-dist/darwin_x86_64/bin/mm2plus-avx2 ]] || { echo "::error::Missing macOS Intel mm2-plus AVX2 entrypoint."; exit 1; }
          toolchains-dist/darwin_x86_64/bin/hictk --help >/dev/null
          toolchains-dist/darwin_x86_64/bin/minimap2 --help >/dev/null || true
          toolchains-dist/darwin_x86_64/bin/mm2plus-avx2 --help >/dev/null || true
          [[ -n "${runfile}" && -f "${runfile}" ]] || { echo "::error::Missing macOS Intel runfile."; exit 1; }
          [[ -n "${launcher}" && -x "${launcher}" ]] || { echo "::error::Missing signed macOS Intel launcher."; exit 1; }
          [[ -n "${shell_launcher}" && -x "${shell_launcher}" ]] || { echo "::error::Missing macOS shell launcher."; exit 1; }
          codesign -dv --verbose=2 "${launcher}" 2>&1 || { echo "::error::macOS Intel launcher is not ad-hoc signed."; exit 1; }
          "${launcher}" --help >/dev/null
      - name: Save Darwin Intel toolchain cache
        if: ${{ success() && steps.cache-darwin-toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: toolchains-dist/darwin_x86_64
          key: ${{ steps.cache-darwin-toolchains.outputs.cache-primary-key }}
      - name: Save Darwin Intel Conan cache
        if: ${{ success() && steps.cache-darwin-conan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/hictk-conan/darwin_x86_64
          key: ${{ steps.cache-darwin-conan.outputs.cache-primary-key }}
      - name: Save HiCT native processing cache
        if: ${{ success() && steps.cache-native-processing.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: build/native-processing/resources
          key: ${{ steps.cache-native-processing.outputs.cache-primary-key }}
      - name: Report non-blocking macOS Intel failure
        if: ${{ failure() }}
        run: echo "::warning::Non-blocking macOS Intel build failed; Windows/Linux release may still proceed without this artifact."
  publish-release-assets:
    name: Publish release assets
    needs:
      - linux-portable
      - windows-portable
      - macos-portable
      - macos-intel-portable
    if: ${{ always() && needs.linux-portable.result == 'success' && needs.windows-portable.result == 'success' && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish_target != 'artifacts-only')) }}
    runs-on: ubuntu-22.04
    env:
      HICTK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hictk_ref || 'v2.2.0' }}
      MINIMAP2_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.minimap2_ref || 'v2.31' }}
      MM2PLUS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mm2plus_ref || 'v1.2' }}
      HICT_WEBUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.webui_ref || 'same-as-jvm' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloaded-artifacts

      - name: Collect assets and provenance
        shell: bash
        env:
          PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target || '' }}
          SELECTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < version.txt)"
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="latest-master"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${PUBLISH_TARGET}" == "latest-master" ]]; then
              release_tag="latest-master"
            elif [[ "${PUBLISH_TARGET}" == "release-tag" ]]; then
              release_tag="${SELECTED_RELEASE_TAG}"
              if [[ -z "${release_tag}" ]]; then
                echo "release_tag is required when publish_target=release-tag." >&2
                exit 1
              fi
            fi
          fi

          rm -rf release-dist
          mkdir -p release-dist
          while IFS= read -r -d '' file; do
            cp -f "${file}" "release-dist/$(basename "${file}")"
          done < <(
            find downloaded-artifacts -type f \( \
              -name '*.jar' -o \
              -name '*.run' -o \
              -name '*.exe' -o \
              -name '*.zip' -o \
              -name '*.tar.gz' -o \
              -name '*.sha256' \
            \) -print0
          )

          compgen -G "release-dist/*-fat.jar" >/dev/null || { echo "No fat JAR was collected." >&2; exit 1; }
          compgen -G "release-dist/HiCT-*-linux-x86_64.run" >/dev/null || { echo "No Linux .run artifact was collected." >&2; exit 1; }
          compgen -G "release-dist/HiCT-*-windows-x86_64.exe" >/dev/null || { echo "No Windows .exe artifact was collected." >&2; exit 1; }

          provenance_file="release-dist/HiCT-${version}-build-origin.txt"
          {
            echo "HiCT release build provenance"
            echo "============================="
            echo
            echo "version: ${version}"
            echo "release_tag: ${release_tag}"
            echo "trigger: ${GITHUB_EVENT_NAME}"
            echo "repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "source_ref: ${GITHUB_REF}"
            echo "source_sha: ${GITHUB_SHA}"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "bundled_refs:"
            echo "  hictk: ${HICTK_REF}"
            echo "  minimap2: ${MINIMAP2_REF}"
            echo "  mm2_plus: ${MM2PLUS_REF}"
            echo "  hict_webui: ${HICT_WEBUI_REF}"
            echo
            echo "asset_sha256:"
            (
              cd release-dist
              find . -maxdepth 1 -type f \
                ! -name "HiCT-${version}-build-origin.txt" \
                ! -name "HiCT-${version}-release-assets.sha256" \
                -printf '%P\0' |
                sort -z |
                xargs -0 sha256sum
            ) | sed 's/^/  /'
          } > "${provenance_file}"

          checksum_file="HiCT-${version}-release-assets.sha256"
          (
            cd release-dist
            rm -f "${checksum_file}"
            sha256sum * | sort -k2 > "${checksum_file}"
          )

          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          linux_run="HiCT-${version}-linux-x86_64.run"
          windows_exe="HiCT-${version}-windows-x86_64.exe"
          darwin_arm64_run="HiCT-${version}-darwin-arm64.run"
          darwin_x86_64_run="HiCT-${version}-darwin-x86_64.run"
          release_body_lines=(
            "Automated HiCT portable build from \`${GITHUB_SHA}\`."
            ""
            "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            ""
            "**⚠️ For quick testing, download the exact artifact for your OS:**"
          )

          if [[ -f "release-dist/${windows_exe}" ]]; then
            release_body_lines+=("- Windows: [\`${windows_exe}\`](${release_base_url}/${windows_exe})")
          fi
          if [[ -f "release-dist/${linux_run}" ]]; then
            release_body_lines+=("- Linux: [\`${linux_run}\`](${release_base_url}/${linux_run})")
            release_body_lines+=("  After download, run \`chmod +x ${linux_run}\` and then \`bash ${linux_run}\`.")
          fi
          darwin_assets=()
          if [[ -f "release-dist/${darwin_arm64_run}" ]]; then
            darwin_assets+=("[\`${darwin_arm64_run}\`](${release_base_url}/${darwin_arm64_run})")
          fi
          if [[ -f "release-dist/${darwin_x86_64_run}" ]]; then
            darwin_assets+=("[\`${darwin_x86_64_run}\`](${release_base_url}/${darwin_x86_64_run})")
          fi
          if [[ ${#darwin_assets[@]} -gt 0 ]]; then
            release_body_lines+=("- macOS: ${darwin_assets[*]}")
            release_body_lines+=("  If Gatekeeper blocks the file after download, run \`xattr -d com.apple.quarantine ./HiCT-*.run\`.")
          else
            echo "::warning::No macOS portable artifacts were collected; publishing Windows/Linux release only."
          fi

          release_body_lines+=("")
          release_body_lines+=("See \`HiCT-${version}-build-origin.txt\` and \`HiCT-${version}-release-assets.sha256\` for provenance and checksums.")
          printf '%s\n' "${release_body_lines[@]}" > release-body.md

      - name: Move latest-master tag
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-master "${GITHUB_SHA}"
          git push --force origin refs/tags/latest-master

      - name: Clear previous latest-master assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest-master >/dev/null 2>&1; then
            gh release view latest-master --json assets -q '.assets[].name' |
              while IFS= read -r asset; do
                [[ -n "${asset}" ]] && gh release delete-asset latest-master "${asset}" -y
              done
          fi

      - name: Publish latest master release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'latest-master') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-master
          target_commitish: ${{ github.sha }}
          name: Latest master portable build
          body_path: release-body.md
          prerelease: true
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach assets to release event
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach assets to selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'release-tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
