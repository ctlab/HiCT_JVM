name: Autobuild Release

on:
  push:
    branches: ["master", "dev*", "jvm-sfx-native"]
  pull_request:
    branches: ["master", "dev*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  HICT_JHDF5_REPO: "AxisAlexNT/jhdf5-with-plugins-configuration-snapshot"
  HICT_JHDF5_REF: "jhdf5-with-plugins-configuration-snapshot"
  HICT_JHDF5_JAR_NAME: "sis-jhdf5-19.04.1-slim.jar"
  HICT_JHDF5_LOCAL_JAR: "src/main/resources/libs/sis-jhdf5-19.04.1-slim.jar"
  HICT_JHDF5_SOURCE_MODE: "release"
  HICT_REQUIRE_SNAPSHOT_JHDF5: "1"
  HICT_REQUIRE_BUNDLED_JHDF5: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Resolve release JHDF5 jar and native archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/resolve_jhdf5_jar.sh

      - name: Build
        run: ./gradlew -PrequireBundledWebUI=true clean build

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-fat-jar
          path: build/libs/*-fat.jar
          if-no-files-found: error
