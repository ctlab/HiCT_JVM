name: Autobuild Release

on:
  push:
    branches: ["master", "dev*"]
  pull_request:
    branches: ["master", "dev*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build
        run: ./gradlew -PrequireBundledWebUI=true clean build

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: hict-fat-jar
          path: build/libs/*-fat.jar
          if-no-files-found: error
