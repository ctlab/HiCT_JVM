name: JVM CI Tests

on:
  push:
    branches: ["master", "dev*", "jvm-api-v1", "jvm-sfx-native"]
  pull_request:
    branches: ["master", "dev*", "jvm-api-v1", "jvm-sfx-native"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run JVM unit and integration tests
        run: ./gradlew test testNativeProcessingBaseline -x copyWebUI
