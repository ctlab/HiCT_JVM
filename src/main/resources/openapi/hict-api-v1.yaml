      operationId: listExamples
      responses:
        '200':
          description: Merged catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /examples/download/start:
    post:
      tags: [Files]
      summary: Download the files of one example in the background
      description: >
        Takes an example id only. The server resolves addresses, names, sizes and hashes from its own
        catalog, accepts https addresses that resolve to public hosts (each redirect is checked again),
        resumes partial files with Range and If-Range, verifies length and sha256 when the catalog has
        them, writes to `<data>/examples/<id>/` through a temporary name, and records a manifest with
        the attribution. Optional files may fail. Nothing downloaded is executed.
      operationId: startExampleDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exampleId]
              properties:
                exampleId: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '404':
          description: Unknown example
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409':
          description: Another example is being downloaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /examples/download/status:
    post:
      tags: [Files]
      summary: Status of the example download
      description: >-
        Includes the local jobId, whose /jobs identifier is download/{jobId}.
        A zero totalBytes means that the transfer size is unknown; progress in
        /jobs is null until a reliable total is available. Cancellation via
        /jobs/cancel is scoped to this exact download attempt.
      operationId: exampleDownloadStatus
      responses:
        '200':
          description: state, progress, bytes, current file, finished files, skipped optional files, error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /examples/download/cancel:
    post:
      tags: [Files]
      summary: Cancel the example download
      description: Partial files are kept so the download can resume.
      operationId: cancelExampleDownload
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /fasta_only/start:
    post:
      tags: [Files]
      summary: Build an assembly from a FASTA file alone (no contact data)
      description: >
        Starts one background job that reads the FASTA once and writes `fasta-only/<name>.hict.hdf5` in
        the data directory: one contig per record, a declared SEQUENCE_ONLY source with no contacts, and
        when `splitAtN` is set an AGP (`.agp`) that splits records at runs of at least `minNRun` N
        (case-insensitive, default 100) and keeps the true gap lengths. Empty and all-N records are
        skipped and listed in the warnings; duplicate names are refused. Cancelling or failing leaves
        no output that looks finished. Open the result with the FASTA linked, then apply the AGP.
      operationId: startFastaOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fastaFilename]
              properties:
                fastaFilename: { type: string, description: Path of the plain or gzip FASTA relative to the data directory }
                splitAtN: { type: boolean, default: false }
                minNRun: { type: integer, minimum: 1, maximum: 1000000, default: 100 }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409':
          description: Another FASTA is already being read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /fasta_only/status:
    post:
      tags: [Files]
      summary: Status of the FASTA-only job
      description: >
        state (IDLE, RUNNING, READY, FAILED, CANCELLED), progress, message, error and on READY the
        outputFilename, agpFilename (null when nothing was split), fastaFilename, contig count, total
        bases, warnings and whether an existing output was reused.
      operationId: fastaOnlyStatus
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /fasta_only/cancel:
    post:
      tags: [Files]
      summary: Cancel the FASTA-only job
      operationId: cancelFastaOnly
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /normalization/coverage/prepare:
    post:
      tags: [Normalization]
      summary: Start computing square-root coverage vectors for every open source
      description: >
        Starts one background job that reads the stored contacts of every resolution twice and builds
        square-root coverage weights over the whole opened map. Vectors are published only when
        all resolutions of all open sources are done. Follow a running job through the status endpoint.
      operationId: prepareCoverageNormalization
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409':
          description: No map is open, or a preparation is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /normalization/coverage/status:
    post:
      tags: [Normalization]
      summary: Status of the square-root coverage job
      description: >
        Returns state (IDLE, RUNNING, READY, FAILED, CANCELLED), progress 0..1, message, algorithm version,
        error, whether vectors are prepared for every open source, the weights mode of the primary source
        (FILE or SQRT_COVERAGE), whether every open source uses the same mode (consistent) and an
        estimate of the memory the vectors take.
      operationId: coverageNormalizationStatus
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /normalization/coverage/cancel:
    post:
      tags: [Normalization]
      summary: Cancel the running square-root coverage job
      description: Nothing is published and the maps are unchanged. Cancelling when no job runs is not an error.
      operationId: cancelCoverageNormalization
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /normalization/weights:
    post:
      tags: [Normalization]
      summary: Choose which per-bin weights tiles use when weights are applied
      description: >
        mode FILE uses the weights stored in the file. mode SQRT_COVERAGE uses the prepared coverage
        vectors and answers 409 until every open source has them. All open sources switch together and
        the tile version advances. This does not turn weights on or off; the render options do.
      operationId: selectNormalizationWeights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [FILE, SQRT_COVERAGE] }
      responses:
        '200':
          description: The mode now in use and the new tile version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '400':
          description: Unknown mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409':
          description: Coverage is not prepared, or no map is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /tracks/probe:
