      tags: [Conversion]
      summary: Configure dotplot self-alignment engine preference
      operationId: setDotplotAlignerPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                alignerPreference:
                  type: string
                  enum: [auto, minimap2, mm2plus, mm2plus-avx2, mm2plus-avx512]
                  description: Runtime preference for dotplot self-alignment jobs.
              required: [alignerPreference]
      responses:
        '200':
          description: Updated toolchain status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /sequence/alignment_detail:
    post:
      tags: [Sequence analysis]
      summary: Start or inspect exact alignment detail for two bounded sequence intervals
      operationId: sequenceAlignmentDetail
      description: Runs the bundled minimap2-compatible aligner with extended CIGAR output and all reported chains. Tiny windows (both at most 64 bases) use short-window-v1 (k=2, w=1, m=2, n=1, s=2), larger windows use seeded-window-v1 (k=7, w=3, m=12, n=2, s=12). Both use one thread, -P, --dual=no, --no-long-join, -c and --eqx. Every canonical match/substitution is checked against the frozen source bases on its strand. Coordinates are zero-based and half-open. These seeded local alignments are not exhaustive homology calls. Empty results are explicit. Output limits fail rather than silently dropping records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string }
                - type: object
                  required: [rowStart, rowEnd, columnStart, columnEnd]
                  properties:
                    rowStart: { type: integer, format: int64, minimum: 0 }
                    rowEnd: { type: integer, format: int64, minimum: 1 }
                    columnStart: { type: integer, format: int64, minimum: 0 }
                    columnEnd: { type: integer, format: int64, minimum: 1 }
                    includeGaps: { type: boolean, default: false }
                  description: Each interval contains at most 4096 bases.
      responses:
        '200':
          description: Terminal alignment job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlignmentDetailResponse' }
        '202':
          description: Active alignment job status. Cancel through sequence/jobs/{jobId}/stop.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlignmentDetailResponse' }
        '400': { description: Invalid sequence intervals }
        '404': { description: Alignment job was not found or has expired }
        '409': { description: Missing map or FASTA, or stale assembly revision }
        '503': { description: Sequence analysis queue is full }
  /sequence/repeat_period:
    post:
      tags: [Sequence analysis]
      summary: Start or inspect a bounded ungapped repeat-period measurement
      operationId: sequenceRepeatPeriod
      description: Frozen gapless assembly interval of 1 to 4096 bases. Displayed history headers guard submission. The shortest supported lag up to half the interval is exploratory, not a repeat annotation or significance test. IUPAC ambiguity is excluded; indels are not modeled. Result and provenance remain in the bounded server job history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string, pattern: '^[a-zA-Z0-9-]{1,64}$' }
                - type: object
                  required: [startBp, endBp]
                  properties:
                    startBp: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
                    endBp: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      responses:
        '200':
          description: Terminal job status with result (length, nullable periodBp/copies/identity, pair counts, ambiguity, composition baseline, method, message, interval, coordinateSystem, snapshot, inputSha256, sourceFasta and sourceStamp). The input hash describes the frozen forward sequence, not the complete FASTA file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '202':
          description: Submitted/running status and jobId. Cancel with sequence/jobs/{jobId}/stop or jobs/cancel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '400': { description: Invalid or out-of-assembly interval }
        '404': { description: Measurement job is unavailable or expired }
        '409': { description: Missing active FASTA or stale assembly }
        '503': { description: Sequence analysis queue is full }
  /sequence/region:
    post:
      tags: [Sequence analysis]
      summary: Read up to 4096 linked FASTA bases in current gap-free assembly coordinates
      operationId: readAssemblySequenceRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startBp, endBp]
              properties:
                startBp: { type: integer, format: int64, minimum: 0 }
                endBp: { type: integer, format: int64, description: Exclusive end }
      responses:
        '200':
          description: Linked status and, when linked, the requested oriented sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: { type: boolean }
                  startBp: { type: integer, format: int64 }
                  sequence: { type: string, maxLength: 4096 }
        '400':
          description: Invalid or oversized region
  /sequence/settings:
    post:
      tags: [Sequence analysis]
      summary: Read or set the default gap for new scaffolds and concatenated sequence analysis
      operationId: sequenceSettings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checkBlast: { type: boolean, default: false, description: "Resolve local BLAST availability; may extract native tools on first use" }
                gapLengthBp: {type: integer, minimum: 0, maximum: 1000000, default: 1000}
      responses:
        '200': {description: Current defaults; imported AGP gaps and existing scaffolds remain unchanged}
        '400': {description: Invalid gap length}
  /sequence/cleanup:
    post:
      tags: [Sequence analysis]
      summary: Reclaim superseded managed overlay matrices after successful replacement and detach
      operationId: cleanupSequenceOverlays
      responses:
        '200': {description: Number of removed matrices; original data and provenance retained}
  /sequence/remote_blast/retrieve:
    post:
      tags: [Sequence analysis]
      summary: Download a completed NCBI RID without submitting any sequence search
      description: Only the RID is sent to NCBI using GET and documented JSON2_S output. Pasted queries remain on the HiCT server and validate returned labels, lengths and aligned bases. Verification scope is recorded for partial/no-hit queries. Identity, e-value, per-HSP coverage, strands and target limits filter retrieved alignments locally. A separate endpoint prevents older servers from treating recovery as a new submission. Global remote-client spacing, a one-minute per-RID interval, bounded output, timeout and Jobs cancellation apply. This does not require linked FASTA or a local BLAST executable.
      operationId: retrieveRemoteBlast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries, scope, mode, searchTarget, bothStrands, remoteConsent, remoteDatabase, remoteRequestId]
              properties:
                queries: {type: string, description: Original FASTA records or one DNA sequence per line, with matching query headers}
                scope: {type: string, enum: [database]}
                mode: {type: string, enum: [blast]}
                searchTarget: {type: string, enum: [NCBI_REMOTE]}
                remoteConsent: {type: boolean, enum: [true], description: Confirm downloading the RID and that it belongs to these queries}
                remoteRequestId: {type: string, maxLength: 128, description: Existing NCBI RID, normalized to uppercase after trimming; 8–64 letters/digits are required}
                remoteDatabase: {type: string, enum: [nt, refseq_rna, 16S_ribosomal_RNA]}
                remoteTimeoutMinutes: {type: integer, minimum: 1, maximum: 30, default: 10}
                bothStrands: {type: boolean}
                evalue: {type: number, exclusiveMinimum: 0, default: 0.00001}
                identity: {type: number, minimum: 0, maximum: 100, default: 70}
                coverage: {type: number, minimum: 0, maximum: 100, default: 50}
                maxTargets: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        '202': {description: Download-only remote_blast job queued}
        '400': {description: Invalid RID, consent, query or retrieval settings}
        '429': {description: Remote queue full}
  /sequence/search/jobs:
    post:
      tags: [Conversion]
      summary: Search a local frozen assembly or explicitly submit pasted queries to NCBI BLAST
      description: Local search creates a source-anchored BED. NCBI_REMOTE requires BLAST mode, database scope and explicit remoteConsent. Only generated query IDs and pasted sequences are uploaded; no linked FASTA is read. Existing RIDs must use the separate download-only retrieval endpoint. Remote results retain external subject coordinates in JSON/TSV, with a separate bounded worker, one active remote client, a 1–30 minute provider timeout and Jobs cancellation. Cancelling stops the client; NCBI may continue a submitted request. No automatic resubmission occurs.
      operationId: startSequenceSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries, scope, mode, bothStrands]
              properties:
                queries: { type: string, description: 'FASTA records or one DNA sequence per line' }
                scope: { type: string, enum: [assembly, selection, database] }
                searchTarget: { type: string, enum: [LOCAL_ASSEMBLY, NCBI_REMOTE], default: LOCAL_ASSEMBLY }
                remoteConsent: { type: boolean, default: false, description: Must be explicitly true for NCBI remote submission. }
                remoteDatabase: { type: string, enum: [nt, refseq_rna, 16S_ribosomal_RNA] }
                remoteTimeoutMinutes: { type: integer, minimum: 1, maximum: 30, default: 10 }
                mode: { type: string, enum: [exact, substitutions, blast] }
                bothStrands: { type: boolean }
                degenerate: { type: boolean, default: false }
                mismatches: { type: integer, minimum: 0, default: 1 }
                threads: { type: integer, default: -1 }
                forwardColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: '#dc2626' }
                reverseColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: '#2563eb' }
                outputFilename: { type: string, description: 'Optional durable .bed path relative to DATA_DIR; managed sidecar is used when omitted' }
                overwrite: { type: boolean, default: false }
                gapLengthBp: {type: integer, minimum: 0, maximum: 1000000, default: 1000}
                evalue: {type: number, exclusiveMinimum: 0, default: 10}
                identity: {type: number, minimum: 0, maximum: 100, default: 70}
                coverage: {type: number, minimum: 0, maximum: 100, default: 50}
                maxTargets: {type: integer, minimum: 1, maximum: 1000000, default: 500, description: 'Remote requests allow at most 500 targets per query and default to 50. Remote queries are limited to ten records and 100,000 total bases.'}
                startBp: { type: integer, format: int64, minimum: 0, description: 'Selection start, zero-based and inclusive' }
                endBp: { type: integer, format: int64, minimum: 1, description: 'Selection end, exclusive' }
      responses:
        '202':
          description: Submitted local search or remote_blast job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '400': { description: 'Invalid query, scope or matching settings' }
        '409': { description: 'Local prerequisites or required search executable unavailable' }
        '429': { description: 'Analysis queue full' }
  /sequence/remote_blast/result:
    post:
      tags: [Sequence analysis]
      summary: Read a completed external BLAST report or its raw TSV
      operationId: getRemoteBlastResult
      description: Reads only a known completed remote_blast job from managed storage. JSON retains provider/database, dates, query hash and descriptions, thresholds, and external one-based inclusive subject/query coordinates. At most 20,000 alignments are included in JSON, with a truncated flag and full count; bounded raw TSV retains all returned rows. URLs and subject accessions are data and are never mapped to the assembly or executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string }
                format: { type: string, enum: [JSON, TSV], default: JSON }
      responses:
        '200':
          description: External BLAST result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
            text/tab-separated-values:
              schema: { type: string }
        '400': { description: Invalid job ID or result format }
        '404': { description: Unknown remote BLAST job }
        '409': { description: Results not ready }
  /sequence/moddotplot/estimate:
    post:
      tags: [Sequence analysis]
      operationId: estimateModDotPlot
      summary: Estimate the requested analysis and overview pyramid before starting a job
      requestBody:
        $ref: '#/paths/~1sequence~1moddotplot~1jobs/post/requestBody'
      responses:
        '200':
          description: Selected spans, direct and overview levels, upper storage estimate and first level over budget
          content:
            application/json:
              schema:
                type: object
                required: [rowBp, columnBp, requestedLevels, overviewLevels, estimatedBytes]
                properties:
                  rowBp: {type: integer, format: int64}
                  columnBp: {type: integer, format: int64}
                  requestedLevels: {type: array, items: {type: integer, format: int64}}
                  overviewLevels: {type: array, items: {type: integer, format: int64}}
                  estimatedBytes: {type: integer, format: int64}
                  limitingLevel: {type: integer, format: int64}
        '400': {description: Invalid parameters or selection}
        '409': {description: Active map or FASTA unavailable}
        '413': {description: Estimate outside representable range}
  /sequence/dotplot/estimate:
    post:
      tags: [Sequence analysis]
      operationId: estimateAlignmentDotplot
      summary: Estimate the requested analysis and overview pyramid before starting a job
      requestBody:
        $ref: '#/paths/~1sequence~1dotplot~1jobs/post/requestBody'
      responses:
        '200':
          description: Selected spans, direct and overview levels, upper storage estimate and first level over budget
          content:
            application/json:
              schema:
                type: object
                required: [rowBp, columnBp, requestedLevels, overviewLevels, estimatedBytes]
                properties:
                  rowBp: {type: integer, format: int64}
                  columnBp: {type: integer, format: int64}
                  requestedLevels: {type: array, items: {type: integer, format: int64}}
                  overviewLevels: {type: array, items: {type: integer, format: int64}}
                  estimatedBytes: {type: integer, format: int64}
                  limitingLevel: {type: integer, format: int64}
        '400': {description: Invalid parameters or selection}
        '409': {description: Active map or FASTA unavailable}
        '413': {description: Estimate outside representable range}
  /sequence/overview/jobs:
    post:
      tags: [Sequence analysis]
      operationId: buildOverlayOverview
      summary: Build or reuse an overview cache for the attached secondary source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceFilename]
              properties:
                sourceFilename: {type: string}
      responses:
        '200': {description: Cache job status and completed output filename when available}
        '409': {description: Attachment changed or pyramid already complete}
        '429': {description: Analysis queue is full}
  /sequence/moddotplot/jobs:
    post:
      tags: [Sequence analysis]
      summary: Generate or accumulate a source-anchored ModDotPlot overlay
      operationId: startModDotPlot
      description: Captures the active assembly, evaluates identity at each requested source-bin resolution, and writes an immutable compatible HiCT sidecar version. The requested levels may be independent of the input contact pyramid. A window must be at least as long as the selected k-mer. Existing versions remain intact on failure or cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, mergeCompatible, resolutions]
              properties:
                scope: {type: string, enum: [assembly, selection]}
                displayMode: {type: string, enum: [overlay, below, above, none], description: "Result presentation. Defaults to overlay for selection and below for assembly; retained in Jobs outputs."}
                mergeCompatible: {type: boolean}
                gapLengthBp: {type: integer, minimum: 0, maximum: 1000000, default: 1000}
                resolutions: {type: array, minItems: 1, items: {type: integer, format: int64, minimum: 1}}
                k: {type: integer, default: 21, minimum: 1, maximum: 65535}
                identity: {type: number, default: 80, minimum: 0, maximum: 100}
                sketchSize: {type: integer, default: 1000, minimum: 1, maximum: 1000000}
                delta: {type: number, default: 0.5, minimum: 0, maximum: 1}
                threads: {type: integer, minimum: -1, maximum: 256, default: -1, description: '-1 all allocated logical CPUs; 0 adaptive auto; 1 single-threaded; positive exact cap'}
                outputFilename: {type: string, description: 'Optional durable .hict.hdf5 path relative to DATA_DIR'}
                overwrite: {type: boolean, default: false}
                region:
                  type: object
                  required: [rowStart, rowEnd, columnStart, columnEnd]
                  properties:
                    rowStart: {type: integer, format: int64, minimum: 0}
                    rowEnd: {type: integer, format: int64, minimum: 1}
                    columnStart: {type: integer, format: int64, minimum: 0}
                    columnEnd: {type: integer, format: int64, minimum: 1}
      responses:
        '202': {description: Analysis queued; poll sequence/jobs/list for progress and outputFile}
        '400': {description: Invalid parameters or selection}
        '409': {description: Map or linked FASTA unavailable, or stale assembly revision}
        '413': {description: Overlay estimate exceeds the memory or disk budget. Select a smaller region or fewer resolutions.}
        '429': {description: Analysis queue is full}
  /sequence/dotplot/jobs:
    post:
      tags: [Sequence analysis]
      summary: Generate or accumulate a selected alignment dotplot
      operationId: startAssemblyDotPlot
      description: Captures the active assembly, aligns the selected sequence axes using the configured minimap2/mm2-plus, and samples PAF alignments into the requested source-bin resolutions. These may be independent of the input contact pyramid. The job writes an immutable compatible HiCT sidecar version and preserves existing versions on failure or cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, mergeCompatible, resolutions]
              properties:
                scope: {type: string, enum: [assembly, selection]}
                displayMode: {type: string, enum: [overlay, below, above, none], description: "Result presentation. Defaults to overlay for selection and below for assembly; retained in Jobs outputs."}
                mergeCompatible: {type: boolean}
                gapLengthBp: {type: integer, minimum: 0, maximum: 1000000, default: 1000}
                resolutions: {type: array, minItems: 1, items: {type: integer, format: int64, minimum: 1}}
                k: {type: integer, default: 15, minimum: 1, maximum: 28}
                window: {type: integer, default: 10, minimum: 1, maximum: 255}
                chainScore: {type: integer, default: 40, minimum: 1, maximum: 1000000}
                sampleBp: {type: integer, default: 100, minimum: 1, maximum: 1000000}
                minAlignmentLength: {type: integer, default: 100, minimum: 1, maximum: 100000000}
                threads: {type: integer, default: -1, minimum: -1, maximum: 256, description: '-1 all allocated logical CPUs; 0 adaptive auto; positive exact cap'}
                outputFilename: {type: string, description: 'Optional durable .hict.hdf5 path relative to DATA_DIR'}
                overwrite: {type: boolean, default: false}
                region:
                  type: object
                  required: [rowStart, rowEnd, columnStart, columnEnd]
                  properties:
                    rowStart: {type: integer, format: int64, minimum: 0}
                    rowEnd: {type: integer, format: int64, minimum: 1}
                    columnStart: {type: integer, format: int64, minimum: 0}
                    columnEnd: {type: integer, format: int64, minimum: 1}
      responses:
        '202': {description: Analysis queued; poll sequence/jobs/list for progress and outputFile}
        '400': {description: Invalid parameters or selection}
        '409': {description: Map or linked FASTA unavailable, or stale assembly revision}
        '413': {description: Overlay estimate exceeds the memory or disk budget. Select a smaller region or fewer resolutions.}
        '429': {description: Analysis queue is full}
  /sequence/jobs/list:
    post:
      tags: [Conversion]
      summary: List sequence analysis jobs with progress, output paths and recent logs
      operationId: listSequenceAnalysisJobs
      responses:
        '200':
          description: Jobs in the current server session; full provenance is retained beside each result
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenericMap' }
  /sequence/jobs/{jobId}/stop:
    post:
      tags: [Conversion]
      summary: Cancel a sequence job and its child process
      operationId: stopSequenceAnalysisJob
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Job status; incomplete results are not attached as tracks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '404': { description: 'Unknown job' }
  /dotplot/jobs:
    post:
      tags: [Conversion]
      summary: Start self-alignment dotplot generation jobs
      operationId: startDotplotJobs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartDotplotJobsRequest' }
      responses:
        '200':
          description: Dotplot job submission status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /dotplot/jobs/list:
    post:
      tags: [Conversion]
      summary: List self-alignment dotplot jobs
      operationId: listDotplotJobs
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Dotplot job list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenericMap' }
  /dotplot/jobs/{jobId}/stop:
    post:
      tags: [Conversion]
      summary: Request dotplot job cancellation
      operationId: stopDotplotJob
      parameters:
        - $ref: '#/components/parameters/jobId'
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Stop status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
  /convert/download/{jobId}:
    get:
      tags: [Conversion]
      summary: Download conversion result file for completed job
      operationId: downloadConversionResult
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Converted artifact stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    EmptyBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyObject'
          example: {}
  schemas:
    BackgroundJob:
      type: object
      required: [id, kind, state, canCancel, outputs]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string, enum: [submitted, running, finished, failed, cancelled] }
        canCancel: { type: boolean }
        progress: { type: number, nullable: true, minimum: 0, maximum: 1 }
        createdAtMs: { type: integer, format: int64, nullable: true }
        startedAtMs: { type: integer, format: int64, nullable: true }
        finishedAtMs: { type: integer, format: int64, nullable: true }
        message: { type: string, nullable: true }
        error: { type: string, nullable: true }
        details:
          type: object
          nullable: true
          properties:
            title: { type: string, nullable: true }
            completedBytes: { type: integer, format: int64, minimum: 0, nullable: true }
            totalBytes: { type: integer, format: int64, minimum: 0, nullable: true, description: Zero means an unknown transfer size. }
            currentFile: { type: string, nullable: true }
            warnings: { type: array, items: { type: string } }
            exampleId: { type: string, nullable: true, description: Catalog entry to focus when resuming an example. }
        outputs:
          type: array
          items:
            type: object
            required: [filename, action]
            properties:
              filename: { type: string }
              action: { type: string, enum: [open_map, download, open_tracks, open_blast_results, attach_identity, attach_dotplot, fasta_only, example] }
              fastaFilename: { type: string, nullable: true }
              agpFilename: { type: string, nullable: true }
              mapFilename: { type: string, nullable: true }
              displayMode: { type: string, nullable: true, enum: [overlay, below, above, none] }
              displayName: { type: string, description: Human-readable result filename when filename is a download endpoint. }

    EmptyObject:
      type: object
      additionalProperties: false
    GenericMap:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    VersionResponse:
      type: object
      properties:
        version: { type: string }
        webuiVersion: { type: string }
      required: [version, webuiVersion]
    ChangelogResponse:
      type: object
      properties:
        text: { type: string }
      required: [text]
    NativeProcessingStatus:
      type: object
      properties:
        requested: { type: boolean }
        enabled: { type: boolean }
        available: { type: boolean }
        version: { type: string }
        source: { type: string }
        reason: { type: string }
        lastFailure: { type: string }
        nativeSessionActive: { type: boolean }
        nativeOperationCount: { type: integer, format: int64 }
        nativeFailedOperationCount: { type: integer, format: int64 }
        nativeHdf5BackendAvailable: { type: boolean }
      required: [requested, enabled, available, version, source, reason, lastFailure]
    EndpointStatistics:
      type: object
      properties:
        path: { type: string }
        totalRequests: { type: integer, format: int64 }
        requestsPerSecondLast10s: { type: number, format: double }
        requestsPerSecondLast60s: { type: number, format: double }
      required: [path, totalRequests, requestsPerSecondLast10s, requestsPerSecondLast60s]
    RuntimeStatistics:
      type: object
      properties:
        timestampMs: { type: integer, format: int64 }
        startedMs: { type: integer, format: int64 }
        uptimeSeconds: { type: number, format: double }
        totalRequests: { type: integer, format: int64 }
        inFlightRequests: { type: integer, format: int64 }
        meanRequestsPerSecond: { type: number, format: double }
        requestsPerSecondLast10s: { type: number, format: double }
        requestsPerSecondLast60s: { type: number, format: double }
        heapUsedBytes: { type: integer, format: int64 }
        heapCommittedBytes: { type: integer, format: int64 }
        heapMaxBytes: { type: integer, format: int64 }
        nonHeapUsedBytes: { type: integer, format: int64 }
        nonHeapCommittedBytes: { type: integer, format: int64 }
        availableProcessors: { type: integer }
        liveThreads: { type: integer }
        daemonThreads: { type: integer }
        peakThreads: { type: integer }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/EndpointStatistics' }
        nativeProcessing:
          $ref: '#/components/schemas/NativeProcessingStatus'
      required:
        - timestampMs
        - startedMs
        - uptimeSeconds
        - totalRequests
        - inFlightRequests
        - meanRequestsPerSecond
        - requestsPerSecondLast10s
        - requestsPerSecondLast60s
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - nonHeapUsedBytes
        - nonHeapCommittedBytes
        - availableProcessors
        - liveThreads
        - daemonThreads
        - peakThreads
        - endpoints
        - nativeProcessing
    SetNativeProcessingEnabledRequest:
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]
    FileEntry:
      type: object
      properties:
        path: { type: string }
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modifiedAtMs: { type: integer, format: int64 }
        extension: { type: string }
        type:
          type: string
          enum: [file, directory]
        symbolicLink: { type: boolean }
    ListDirectoryRequest:
      type: object
      properties:
        directory:
          type: string
          description: Relative directory path under DATA_DIR. Empty or omitted means DATA_DIR root.

    OpenFileRequest:
      type: object
      properties:
        filename: { type: string }
        fastaFilename: { type: string }
      required: [filename]
    WorkspaceVersion:
      type: object
      required: [session, revision]
      properties:
        session: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 0 }
    OpenFileResponse:
      type: object
      properties:
        status: { type: string }
        dtype: { type: string }
        resolutions: { type: array, items: { type: integer, format: int64 } }
        pixelResolutions: { type: array, items: { type: number } }
        tileSize: { type: integer }
        assemblyInfo: { type: object, additionalProperties: true }
        matrixSizesBins: { type: array, items: { type: integer } }
        usableCoolerWeights:
          type: boolean
          description: Whether any stored matrix resolution has a finite, nonzero weight for a real bin.
        capabilities: { $ref: '#/components/schemas/SourceCapabilities' }
        workspaceVersion: { $ref: '#/components/schemas/WorkspaceVersion' }
      required: [status, resolutions, assemblyInfo]
    OpenProgressResponse:
      type: object
      properties:
        stage: { type: string }
        progress: { type: number }
      required: [stage, progress]
    AttachResponse:
      type: object
      properties:
        filename: { type: string }
        fastaFilename: { type: string }
        openFileResponse: { $ref: '#/components/schemas/OpenFileResponse' }
        workspaceVersion: { $ref: '#/components/schemas/WorkspaceVersion' }
        workspaceState: { type: object, nullable: true, additionalProperties: true }

    OpenSecondaryRequest:
      type: object
      properties:
        filename: { type: string }
        allowMismatch: { type: boolean, default: false }
      required: [filename]
    SetAssemblySourceRequest:
      type: object
      properties:
        assemblySource:
          type: string
          enum: [PRIMARY, SECONDARY]
      required: [assemblySource]
    SessionContentFingerprint:
      type: object
      required: [algorithm, sizeBytes, sha256]
      properties:
        algorithm: { type: string, enum: [SHA-256] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    SessionSourceSnapshot:
      type: object
      required: [filename, fastaFilename, agp, agpSha256, assemblyInfo, contigNameOverrides, scaffoldNameOverrides, capabilities]
      properties:
        filename: { type: string }
        fastaFilename: { type: string }
        agp: { type: string }
        fileFingerprint: { $ref: '#/components/schemas/SessionContentFingerprint' }
        fastaFingerprint: { $ref: '#/components/schemas/SessionContentFingerprint' }
        agpSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        assemblyInfo: { type: object, additionalProperties: true }
        contigNameOverrides: { type: object, additionalProperties: { type: string } }
        scaffoldNameOverrides: { type: object, additionalProperties: { type: string } }
        splitEdits:
          type: array
          description: Native split operations in edit order, used to recover contact-bin ownership before applying AGP.
          items:
            type: object
            required: [parentId, sourceName, sourceOffsetBp, parentLengthBp, reversed, splitOffsetBp, leftId, rightId]
            properties:
              parentId: { type: integer, format: int32, minimum: 0 }
              sourceName: { type: string, minLength: 1 }
              sourceOffsetBp: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
              parentLengthBp: { type: integer, format: int64, minimum: 2 }
              reversed: { type: boolean }
              splitOffsetBp: { type: integer, format: int64, minimum: 1 }
              leftId: { type: integer, format: int32, minimum: 1 }
              rightId: { type: integer, format: int32, minimum: 2 }
              exact: { type: boolean, default: false, description: With snapshot v2, retain every base and reference crossing source bins in both children. Absent or false replays the historical bin-removing operation. }
        capabilities: { $ref: '#/components/schemas/SourceCapabilities' }
        exampleProvenance:
          type: object
          description: Optional frozen example declaration and recorded cache hashes, captured when opening a declared matrix or a current converted result. Restore preserves this historical metadata without consulting the live catalog, fetching URLs or executing its recipe. These records do not authenticate a session or replace the source file fingerprints.
          required: [schemaVersion, capturedAt, catalogSource, catalogFingerprint, catalogExample, files, matrixInputFilename, matrixOpenedFilename, matrixAssociation]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            capturedAt: { type: string, format: date-time }
            catalogSource: { type: string, maxLength: 8192 }
            catalogFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
            catalogExample: { type: object, additionalProperties: true, description: Recorded example validated against the catalog schema. }
            files:
              type: array
              items:
                type: object
                required: [filename, bytes, sha256]
                properties:
                  filename: { type: string }
                  bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
                  sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            matrixInputFilename: { type: string }
            matrixOpenedFilename: { type: string }
            matrixAssociation: { type: string, enum: [DECLARED_HICT, CURRENT_CONVERSION_CACHE] }
    SecondarySourceStatus:
      type: object
      properties:
        assemblyInfo:
          description: Synchronized assembly in the primary map resolution grid after a successful secondary open. Absent from status-only and confirmation responses.
          type: object
          required: [contigDescriptors, scaffoldDescriptors]
          properties:
            contigDescriptors: { type: array, items: { type: object, additionalProperties: true } }
            scaffoldDescriptors: { type: array, items: { type: object, additionalProperties: true } }
        attached: { type: boolean }
        filename: { type: string }
        assemblySource: { type: string, enum: [PRIMARY, SECONDARY] }
        requiresConfirmation: { type: boolean }
        requestedFilename: { type: string }
        warnings:
          type: array
          items: { type: string }
        compatibility:
          $ref: '#/components/schemas/SecondaryCompatibility'
        capabilities: { $ref: '#/components/schemas/SourceCapabilities' }
      required: [attached, filename, assemblySource]
    SourceCapabilities:
      type: object
      description: Declared source semantics. Missing or unknown metadata must not be inferred from filenames or matrix values. Additive since schema version 1.
      required: [schemaVersion, units, scoreScale, contactDataState, resolutions, importedWeightResolutions, weightMetadataComplete, contactNormalization, importedWeights]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        sequenceScaleTiles: { type: boolean, description: Server can project stored source-bin colors onto an explicit one-base display grid. Omitted by older servers. This does not add a stored contact resolution. }
        sequenceScaleTracks: { type: boolean, description: Server supports explicit assembly-BP track queries including hidden and binless sequence. Omitted by older servers. }
        units: { type: string, enum: [CONTACT_COUNT, ALIGNMENT_SAMPLE_COUNT, ALIGNMENT_PRESENCE, IDENTITY_PERCENT, SEQUENCE_ONLY, UNKNOWN] }
        scoreScale: { type: number, minimum: 0, exclusiveMinimum: true }
        contactDataState: { type: string, enum: [PRESENT, ABSENT, UNKNOWN] }
        resolutions: { type: array, items: { type: integer, format: int64, minimum: 1 } }
        importedWeightResolutions: { type: array, items: { type: integer, format: int64, minimum: 1 } }
        weightMetadataComplete: { type: boolean }
        contactNormalization: { $ref: '#/components/schemas/CapabilityAvailability' }
        importedWeights: { $ref: '#/components/schemas/CapabilityAvailability' }
        approximation:
          type: object
          description: Explicit estimation provenance, preserved when an approximate Cooler is reopened or saved in a session. Absent means no declared approximation provenance; it does not prove original observations.
          required: [schemaVersion, method, resolutionPolicy, description, upstreamApproximate]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            method: { type: string }
            resolutionPolicy: { type: string }
            description: { type: string }
            upstreamApproximate: { type: boolean, description: The input to the most recent approximate export was already estimated. }
    CapabilityAvailability:
      type: object
      required: [state, reasonCode, reason]
      properties:
        state: { type: string, enum: [AVAILABLE, UNAVAILABLE, UNKNOWN] }
        reasonCode: { type: string }
        reason: { type: string }
    AlignmentDetailResponse:
      type: object
      required: [jobId, kind, status]
      properties:
        jobId: { type: string }
        kind: { type: string, enum: [alignment_detail] }
        status: { type: string, enum: [submitted, running, finished, failed, cancelled] }
        error: { type: string, nullable: true }
        result:
          type: object
          required: [coordinateSystem, segments, alignmentCount]
          properties:
            coordinateSystem: { type: string, enum: [ASSEMBLY_BP, PADDED_SEQUENCE] }
            alignmentCount: { type: integer, minimum: 0 }
            method: { type: string, description: Additive alignment implementation version }
            aligner: { type: string, description: Executed aligner filename }
            alignerSha256: { type: string, description: SHA-256 of the executed aligner }
            rowSha256: { type: string, description: SHA-256 of frozen row sequence UTF-8 bytes }
            columnSha256: { type: string, description: SHA-256 of frozen column sequence UTF-8 bytes }
            snapshot: { type: string, description: Captured assembly fingerprint }
            rowStart: { type: integer, format: int64, minimum: 0 }
            rowEnd: { type: integer, format: int64, minimum: 1 }
            columnStart: { type: integer, format: int64, minimum: 0 }
            columnEnd: { type: integer, format: int64, minimum: 1 }
            profile:
              type: object
              properties:
                name: { type: string, enum: [short-window-v1, seeded-window-v1] }
                kmer: { type: integer }
                window: { type: integer }
                chainScore: { type: integer }
                seeds: { type: integer }
                alignmentScore: { type: integer }
            message: { type: string, nullable: true }
            segments:
              type: array
              maxItems: 4096
              items:
                type: object
                required: [rowStart, rowEnd, columnStart, columnEnd, operation, reverse, alignment]
                properties:
                  rowStart: { type: integer, format: int64, minimum: 0 }
                  rowEnd: { type: integer, format: int64, minimum: 0 }
                  columnStart: { type: integer, format: int64, minimum: 0 }
                  columnEnd: { type: integer, format: int64, minimum: 0 }
                  operation: { type: string, enum: [MATCH, SUBSTITUTION, INSERTION, DELETION, AMBIGUOUS] }
                  reverse: { type: boolean }
                  alignment: { type: integer, minimum: 0 }
    SecondaryCompatibility:
      type: object
      properties:
        sameResolutions: { type: boolean }
        sameMatrixSizes: { type: boolean }
        sharedReference:
          type: boolean
          description: The original sources declare the same named reference intervals.
        exactMatch: { type: boolean }
        primaryMaxBins: { type: integer, format: int64 }
        secondaryMaxBins: { type: integer, format: int64 }
        primaryBinsByResolution:
          type: array
          items: { type: integer, format: int64 }
        secondaryBinsByResolution:
          type: array
          items: { type: integer, format: int64 }
        mismatchedResolutionOrders:
          type: array
          items: { type: integer }

    VisualizationOptionsRequest:
      type: object
      description: >-
        SimpleLinearGradient colormaps optionally accept gamma (finite, 0.05 through
        100, default 1). Ordinary gradient colors interpolate with
        pow(clamp((signal-minSignal)/(maxSignal-minSignal),0,1),gamma).
        Gamma affects RGBA only, not numeric signals, histograms or thresholds.
        O/E retains its neutral-at-1 ratio palette and identity palettes retain
        their fixed mapping. Legacy payloads without gamma keep their appearance.
      additionalProperties: true
      properties:
        preserveRenderPipeline:
          type: boolean
          default: false
          description: Leave the active custom render pipeline untouched while updating stored visualization options.
        renderPipeline:
          description: Publish this pipeline together with the visualization options.
          allOf:
            - $ref: '#/components/schemas/RenderPipelineConfig'
    ExpectedProfileViewportRequest:
      type: object
      required: [bpResolution, startRowPx, endRowPx, startColPx, endColPx]
      properties:
        bpResolution: { type: integer, format: int64 }
        unit: { type: string, enum: [PIXELS, BINS], default: PIXELS, description: Axis units for all four bounds. The legacy Px field names are retained for compatibility. }
        startRowPx: { type: integer, format: int64 }
        endRowPx: { type: integer, format: int64 }
        startColPx: { type: integer, format: int64 }
        endColPx: { type: integer, format: int64 }
    RenderPipelineConfig:
      type: object
      description: >-
        Observed-view expressions. Colormap mode OBSERVED_OVER_EXPECTED maps an
        already-computed ratio signal around neutral white at 1, with depleted
        startColor and enriched endColor (including alpha), logarithmic interpolation,
        minSignal/maxSignal or connected min/max numeric expressions. Undefined or
        negative ratios are transparent. This palette does not fit an expected
        profile. Expected/O/E view selection retains its separate primary-map
        processing and uses the same palette mapping for O/E.
        LINEAR colormap nodes optionally accept gamma in [0.05,100], default 1,
        applying the same color-only power curve as ordinary gradient options.
        Gamma does not alter the node input or numeric diagnostics and has no
        effect on O/E or identity palette mappings.
      additionalProperties: true

    TileWithRangesResponse:
      type: object
      properties:
        cancelled:
          type: boolean
          default: false
        image:
          type: string
          description: data:image/png;base64,...
        displayGrid:
          type: object
          description: >-
            Present only for sequenceScale=true. Native-cell statistics are omitted
            for this image so their counts cannot be mistaken for base samples.
          properties:
            unit: { type: string, enum: [BASE_PAIRS] }
            bpPerPixel: { type: integer, enum: [1] }
            sourceBpResolution: { type: integer, format: int64 }
            cellSemantics: { type: string, enum: [SOURCE_BIN_REFERENCE_COLORS] }
            contactValuesInterpolated: { type: boolean, enum: [false] }
            startRowBp: { type: integer, format: int64 }
            endRowBp: { type: integer, format: int64 }
            startColBp: { type: integer, format: int64 }
            endColBp: { type: integer, format: int64 }
        ranges:
          type: object
          properties:
            lowerBounds:
              type: object
              additionalProperties: { type: number }
            upperBounds:
              type: object
              additionalProperties: { type: number }

    MatrixQueryRequest:
      type: object
      properties:
        expression:
          type: object
          additionalProperties: true
          description: Optional numeric rendering expression for PIPELINE_SIGNAL diagnostics; does not alter the active pipeline.
        bpResolution:
          type: integer
          format: int64
          description: Resolution in base pairs for matrix extraction.
        unit:
          type: string
          enum: [PIXELS, BINS, BP]
          default: PIXELS
          description: BINS includes hidden contigs and retains the requested rectangle shape. PIXELS excludes hidden contigs; BP is projected into visible pixels.
        units:
          type: string
          enum: [PIXELS, BINS, BP]
          description: Alias for `unit`.
        startRow:
          type: integer
          format: int64
        endRow:
          type: integer
          format: int64
        startCol:
          type: integer
          format: int64
        endCol:
          type: integer
          format: int64
        startRowPx:
          type: integer
          format: int64
        endRowPx:
          type: integer
          format: int64
        startColPx:
          type: integer
          format: int64
        endColPx:
          type: integer
          format: int64
        startRowBin:
          type: integer
          format: int64
        endRowBin:
          type: integer
          format: int64
        startColBin:
          type: integer
          format: int64
        endColBin:
          type: integer
          format: int64
        startRowBP:
          type: integer
          format: int64
        endRowBP:
          type: integer
          format: int64
        startColBP:
          type: integer
          format: int64
        endColBP:
          type: integer
          format: int64
        rows:
          type: integer
          description: Optional height if end is not provided.
        cols:
          type: integer
          description: Optional width if end is not provided.
        signalMode:
          type: string
          enum: [RAW_COUNTS, COOLER_WEIGHTED, TRADITIONAL_NORMALIZED, PIPELINE_SIGNAL]
          default: TRADITIONAL_NORMALIZED
          description: |
            `TRADITIONAL_NORMALIZED` applies the currently selected visualization normalization and display mode.
            Undefined O/E ratios are NaN in floating-point binary output and null in JSON, distinct from measured zero.
        source:
          type: string
          enum: [PRIMARY, SECONDARY]
          default: PRIMARY
          description: Query raw or normalized signal from the selected source in two-map sessions.
        format:
          type: string
          enum: [JSON, BINARY_FLOAT32, BINARY_FLOAT64, BINARY_INT64]
          default: BINARY_FLOAT32
        includeWeights:
          type: boolean
          default: false
        includeBinProvenance:
          type: boolean
          default: false
          description: Include physical source-bin axis runs. Requires format JSON.
      required: [bpResolution]

    MatrixQueryJsonResponse:
      type: object
      properties:
        cancelled:
          type: boolean
          default: false
        rows: { type: integer }
        cols: { type: integer }
        dtype: { type: string, enum: [float64, int64] }
        signalMode: { type: string }
        cellSemantics:
          type: string
          enum: [SOURCE_BIN_REFERENCES, DISPLAY_GRID_SIGNAL]
        binProvenance:
          type: object
          properties:
            identityScope: { type: string, enum: [SOURCE_AND_RESOLUTION] }
            source: { type: string, enum: [PRIMARY, SECONDARY] }
            bpResolution: { type: integer, format: int64 }
            rowAxis: { $ref: '#/components/schemas/SourceBinAxis' }
            colAxis: { $ref: '#/components/schemas/SourceBinAxis' }
        unit: { type: string, enum: [PIXELS, BINS] }
        startRowPx: { type: integer, format: int64 }
        endRowPx: { type: integer, format: int64 }
        startColPx: { type: integer, format: int64 }
        endColPx: { type: integer, format: int64 }
        values:
          type: array
          items:
            type: number
            nullable: true
            description: Numeric signal or raw count, with null for nonfinite or missing signals.
        rowWeights:
          type: array
          items: { type: number }
        colWeights:
          type: array
          items: { type: number }

    SourceBinAxis:
      type: object
      description: |
        Runs are relative to the output array, including any leading zero padding.
        Positions absent from runs have no source-bin identity. A physical identity
        is (source file, resolution, stripeId, binInStripe). Its binInStripe at
        position offset+i is firstBinInStripe+i*step. uniqueSourceBins counts the
        union of referenced physical bins in this axis window only, not the whole
        assembly. It does not deduplicate unordered matrix contacts or pipeline values.
      properties:
        axisLength: { type: integer, format: int64 }
        referencedBins: { type: integer, format: int64 }
        uniqueSourceBins: { type: integer, format: int64 }
        runs:
          type: array
          items:
            type: object
            properties:
              offset: { type: integer, format: int64 }
              length: { type: integer }
              stripeId: { type: integer }
              firstBinInStripe: { type: integer }
              step: { type: integer, enum: [-1, 1] }

    RangeRequest:
      type: object
      properties:
        startBP: { type: integer, format: int64 }
        endBP: { type: integer, format: int64 }
      required: [startBP, endBP]
    MoveSelectionRequest:
      type: object
      properties:
        startBP: { type: integer, format: int64 }
        endBP: { type: integer, format: int64 }
        targetStartBP: { type: integer, format: int64 }
      required: [startBP, endBP, targetStartBP]
    SplitContigRequest:
      type: object
      properties:
        splitPx: { type: integer, format: int64 }
        bpResolution: { type: integer, format: int64 }
      required: [splitPx, bpResolution]
    GroupContigsRequest:
      type: object
      properties:
        startBP: { type: integer, format: int64 }
        endBP: { type: integer, format: int64 }
        newScaffoldName: { type: string }
        spacerLength: { type: integer, format: int64 }
      required: [startBP, endBP]

    LinkFastaRequest:
      type: object
      properties:
        fastaFilename: { type: string }
        allowMismatch: { type: boolean, default: false }
        source:
          type: string
          enum: [PRIMARY, SECONDARY]
      required: [fastaFilename]
    GetFastaForAssemblyRequest:
      type: object
      properties:
        preserveImportedGaps:
          type: boolean
          default: false
          description: Preserve imported gap types, lengths and evidence at unchanged oriented adjacencies. Overrides defaultSpacerLength; enabled by the WebUI.
        defaultSpacerLength:
          type: integer
          format: int64
          minimum: 0
          description: Output gap length in bp. Defaults to HICT_EXPORT_GAP_LENGTH_BP (1000 if unset). Zero joins components without gaps.
        source:
          type: string
          enum: [PRIMARY, SECONDARY]
    FastaSelectionRequest:
      type: object
      properties:
        fromBpX: { type: integer, format: int64 }
        fromBpY: { type: integer, format: int64 }
        toBpX: { type: integer, format: int64 }
        toBpY: { type: integer, format: int64 }
        horizontalSource:
          type: string
          enum: [PRIMARY, SECONDARY]
        verticalSource:
          type: string
          enum: [PRIMARY, SECONDARY]
      required: [fromBpX, fromBpY, toBpX, toBpY]
    GetAgpRequest:
      type: object
      properties:
        preserveImportedGaps:
          type: boolean
          default: false
          description: Preserve imported gap types, lengths and evidence at unchanged oriented adjacencies. Overrides defaultSpacerLength; enabled by the WebUI.
        defaultSpacerLength:
          type: integer
          format: int64
          minimum: 0
          description: Output gap length in bp. Defaults to HICT_EXPORT_GAP_LENGTH_BP (1000 if unset). Zero omits gap rows.
    LoadAgpRequest:
      type: object
      properties:
        missingComponentsPolicy:
          type: string
          enum: [REQUIRE_CHOICE, APPEND_UNPLACED, EXCLUDE, SCAFFOLDED_ONLY]
          default: REQUIRE_CHOICE
          description: APPEND_UNPLACED includes every region. EXCLUDE retains every AGP component but omits uncovered source intervals (legacy behavior). SCAFFOLDED_ONLY also excludes explicit unscaffolded_* singleton objects from the active matrix and FASTA. REQUIRE_CHOICE previews these counts without mutation. Ordinary single-component scaffolds remain scaffolded.
        agpFilename:
          type: string
          description: Optional AGP filename relative to DATA_DIR.
        assemblyFilename:
          type: string
          description: Optional Juicebox .assembly filename relative to DATA_DIR; converted to AGP on demand and saved beside the source file.
        fastaFilename:
          type: string
          description: Optional contig-level FASTA relative to DATA_DIR used for exact Juicebox assembly application; without it the backend falls back to best-effort matching.
        source:
          type: string
          enum: [PRIMARY, SECONDARY]
      required: []

    RenameContigRequest:
      type: object
      properties:
        contigId: { type: integer }
        newName:
          type: string
          nullable: true
      required: [contigId]
    RenameScaffoldRequest:
      type: object
      properties:
        scaffoldId: { type: integer, format: int64 }
        newName:
          type: string
          nullable: true
      required: [scaffoldId]
    ImportNameMappingRequest:
      type: object
      properties:
        contigs:
          type: array
          items:
            type: object
            properties:
              contigId: { type: integer }
              name: { type: string }
            required: [contigId, name]
        scaffolds:
          type: array
          items:
            type: object
            properties:
              scaffoldId: { type: integer, format: int64 }
              name: { type: string }
            required: [scaffoldId, name]
      required: [contigs, scaffolds]

    OpenTrackRequest:
      type: object
      properties:
        filename: { type: string }
        name: { type: string }
        color: { type: string, description: CSS color string }
      required: [filename]
    OpenCoolerWeightsTrackRequest:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
    ProbeTrackRequest:
      type: object
      properties:
        filename: { type: string }
      required: [filename]
    UpdateTrackRequest:
      type: object
      properties:
        trackId: { type: string }
        visible: { type: boolean }
        color: { type: string }
        name: { type: string }
        renderMode: { type: string }
        aggregationMode: { type: string }
        logScale: { type: boolean }
      required: [trackId]
    TrackIdRequest:
      type: object
      properties:
        trackId: { type: string }
      required: [trackId]
    TrackReorderRequest:
      type: object
      properties:
        trackId: { type: string }
        targetIndex: { type: integer, minimum: 0 }
      required: [trackId, targetIndex]
    TrackPrecomputeStartRequest:
      type: object
      properties:
        trackId: { type: string, description: Optional; all tracks if omitted }
        force: { type: boolean, default: false }
    TrackQueryRequest:
      type: object
      properties:
        widthPx: { type: integer, default: 512 }
        bpResolution: { type: integer, format: int64 }
        sequenceScale: { type: boolean, default: false, description: Requires BP units. Uses an explicit uniform base display axis while retaining stored source resolution metadata. }
        unit:
          type: string
          enum: [PIXELS, BINS, BP]
        units:
          type: string
          enum: [PIXELS, BINS, BP]
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
        startPx: { type: integer, format: int64 }
        endPx: { type: integer, format: int64 }
        startBin: { type: integer, format: int64 }
        endBin: { type: integer, format: int64 }
        startBP: { type: integer, format: int64 }
        endBP: { type: integer, format: int64 }
      required: [bpResolution]
    TrackFeatureSearchRequest:
      type: object
      properties:
        query: { type: string, minLength: 1 }
        limit: { type: integer, minimum: 1, default: 50 }
        offset: { type: integer, minimum: 0, default: 0 }
        trackId: { type: string, description: Optional track filter }
      required: [query]
    TrackFeatureContextRequest:
      type: object
      properties:
        widthPx: { type: integer, minimum: 1, default: 1024 }
        bpResolution: { type: integer, format: int64 }
        sequenceScale: { type: boolean, default: false, description: Requires BP units. Context margins and sampling use the assembly-base display axis. }
        marginScreens: { type: number, format: double, default: 1.0 }
        unit:
          type: string
          enum: [PIXELS, BINS, BP]
        units:
          type: string
          enum: [PIXELS, BINS, BP]
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
        startPx: { type: integer, format: int64 }
        endPx: { type: integer, format: int64 }
        startBin: { type: integer, format: int64 }
        endBin: { type: integer, format: int64 }
        startBP: { type: integer, format: int64 }
        endBP: { type: integer, format: int64 }
      required: [bpResolution, widthPx]

    StartConversionJobRequest:
      type: object
      properties:
        filename: { type: string }
        exampleId:
          type: string
          description: Optional quick-start example ID. The server validates the cached recipe and source before submission; its completed Jobs result retains the example recipe and reference context.
        direction:
          type: string
          enum: [mcool-to-hict, hict-to-mcool, hic-to-mcool, hic-to-hict, hicpro-matrix-to-hict, coo-to-hict, bg2-to-hict, pairs-to-hict, validpairs-to-hict]
          default: mcool-to-hict
        outputFilename:
          type: string
          description: Optional output filename relative to DATA_DIR. HiCT-to-Cooler export accepts .cool and .mcool; other directions use their fixed output extension.
        overwrite: { type: boolean, default: false }
        resolutions:
          type: string
          description: Comma-separated resolution list, e.g. "1000,5000,10000"
        compression: { type: integer, default: 6 }
        compressionAlgorithm:
          type: string
          enum: [deflate, lzf, zstd, none]
          default: deflate
        chunkSize: { type: integer, default: 8192 }
        assemblyFilename:
          type: string
          description: Optional .assembly or .agp layout file relative to DATA_DIR. Used for .hic conversion and HiCT export layout requests.
        useCurrentAssembly:
          type: boolean
          default: false
          description: Export the currently opened HiCT assembly state when converting .hict.hdf5 to Cooler.
        approximateRebin:
          type: boolean
          default: false
          description: |
            Explicitly opt in to approximate float64 Cooler rebinning by sequence
            overlap. Requires hict-to-mcool and a current or selected AGP assembly.
            The internal writer models independent uniform endpoints within each
            original bin's actual sequence interval and conserves retained
            unordered contacts. Omitted sequence is not renormalized. Native HiCT
            contacts remain unchanged. Output metadata labels the estimate and
            bins/hict_sequence_fraction records sequence coverage (including gaps).
            Balancing is disabled by default for this mode; explicitly requesting
            balanceExportedCoolers=true is rejected. exportMode is overridden by
            the internal approximate writer.
        exportMode:
          type: string
          enum: [auto, internal, hictk]
          default: auto
        exportAllResolutions:
          type: boolean
          default: false
        buildResolutionPyramid:
          type: boolean
          default: true
        balanceInputCoolers:
          type: boolean
          default: true
        balanceExportedCoolers:
          type: boolean
          default: true
        parallelism: { type: integer, default: -1, minimum: -1, description: "-1 or 0 uses server CPU/Slurm allocation and HICT_CONVERSION_THREADS." }
      required: [filename]
    StartBatchConversionRequest:
      type: object
      properties:
        approximateRebin:
          type: boolean
          default: false
          description: Same opt-in approximate policy as StartConversionJobRequest; requires an AGP for each HiCT input and unbalanced output.
        files:
          type: array
          items: { type: string }
        parallelJobs: { type: integer, default: 1 }
        parallelism: { type: integer, default: -1, minimum: -1, description: "-1 or 0 uses server CPU/Slurm allocation and HICT_CONVERSION_THREADS." }
        overwrite: { type: boolean, default: false }
        resolutions: { type: string }
        compression: { type: integer, default: 6 }
        compressionAlgorithm:
          type: string
          enum: [deflate, lzf, zstd, none]
          default: deflate
        chunkSize: { type: integer, default: 8192 }
        assemblyFilename:
          type: string
          description: Optional .assembly or .agp layout file relative to DATA_DIR. Used for selected .hic conversions.
        assemblyFilenameByFile:
          type: object
          additionalProperties: { type: string }
          description: Optional per-input assembly layout override keyed by source filename.
        exportMode:
          type: string
          enum: [auto, internal, hictk]
          default: auto
        exportAllResolutions:
          type: boolean
          default: false
        buildResolutionPyramid:
          type: boolean
          default: true
        balanceInputCoolers:
          type: boolean
          default: true
        balanceExportedCoolers:
          type: boolean
          default: true
      required: [files]
    StartDotplotJobsRequest:
      type: object
      properties:
        fastaFiles:
          type: array
          items: { type: string }
          description: FASTA files relative to DATA_DIR.
        outputDirectory:
          type: string
          description: Optional output directory relative to DATA_DIR. Defaults to processed output directory.
        binSize:
          type: integer
          default: 1000
          description: Base dotplot bin size in base pairs.
        resolutions:
          type: string
          description: Optional comma-separated zoom resolution list.
        minimizerK:
          type: integer
          default: 17
        minimizerWindow:
          type: integer
          default: 5
        minChainScore:
          type: integer
          default: 40
          description: minimap2 -m chain score cutoff.
        sampleBp:
          type: integer
          default: 250
          description: Sample each minimap2 PAF alignment path every N base pairs when rasterizing to BG2 pixels.
        minAlignmentLength:
          type: integer
          default: 50
          description: Ignore PAF alignments shorter than this many alignment bases.
        extraMinimap2Args:
          type: string
          description: Optional additional minimap2 arguments split by the backend without a shell.
        skipDiagonal:
          type: boolean
          default: false
        dropNearDiagonalBins:
          type: integer
          default: 0
        alignmentThreads:
          type: integer
          default: -1
          minimum: -1
          description: "-1 or 0 uses server CPU/Slurm allocation and HICT_ALIGNMENT_THREADS."
        conversionThreads:
          type: integer
          default: -1
          minimum: -1
          description: "-1 or 0 uses server CPU/Slurm allocation and HICT_CONVERSION_THREADS."
        overwrite:
          type: boolean
          default: false
      required: [fastaFiles, binSize, minimizerK, minimizerWindow, minChainScore, skipDiagonal, dropNearDiagonalBins, alignmentThreads, conversionThreads]
    ConversionSubmitResponse:
      type: object
      properties:
        status: { type: string }
        jobId: { type: string }
      required: [status]
