openapi: 3.0.3
info:
  title: HiCT JVM API
  version: v1
  description: |
    HTTP API for HiCT_JVM server.

    This specification is intended for WebUI integration, Python `hict`/`hict_jvm_api`
    clients and programmatic data-processing pipelines.

    Contig descriptors may include `contigBinOffsets`, a sparse object keyed by
    bp resolution. Each signed int64 value is the source-forward origin of the
    first retained contact bin relative to the contig fragment's sequence start.
    Negative values identify a bin beginning before the fragment. Missing keys
    in this object mean zero; an absent object denotes older implicit geometry.
    The optional `contigBinOffsets` object on compact-v1 assembly snapshots maps
    contig IDs to these same sparse objects, without changing the nine contig
    row columns. An omitted compact map denotes zero origins for current servers.
    Legacy contig descriptors may also include `contigSharedBinSlice: true`;
    compact-v1 uses an optional `sharedBinContigs` array of unique contig IDs.
    These fragments retain every intersecting original contact bin. Adjacent
    fragments can reference the same bin; these references are not additional
    contact observations. Session snapshot v2 preserves this policy when a
    secondary source uses a different resolution pyramid.
    Source sequence offsets (`contigOffsetInSource` in legacy descriptors and
    column 4 in compact-v1 contig rows) are nonnegative int64 coordinates, as are
    split-lineage `sourceOffsetBp` values. Portable sessions validate complete
    source intervals against the maximum exact JavaScript integer (9007199254740991).
servers:
  - url: /
tags:
  - name: Info
  - name: Files
  - name: Secondary source
  - name: Tiles
  - name: Rendering
  - name: Scaffolding
  - name: Names
  - name: Tracks
  - name: Normalization
  - name: Conversion
paths:
  /assembly/history:
    post:
      tags: [Scaffolding]
      summary: Read a page of the current session edit journal
      description: |
        Opening or closing a map, attaching or detaching an overlay, or switching
        assembly source starts a new journal. Each successful assembly response
        includes X-HiCT-History, a JSON summary containing session, revision,
        currentId, position, size, canUndo and canRedo. No contact matrices are stored.
      operationId: getAssemblyHistory
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                offset: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Summary, offset and entries (id, label, timestamp). Summary is null when closed.
          content:
            application/json:
              schema: { type: object }
  /assembly/history/restore:
    post:
      tags: [Scaffolding]
      summary: Undo, redo or restore an earlier or later journal state
      description: |
        Restoration retains later states; a subsequent successful new edit truncates
        the redo branch. Failed and unchanged operations retain it. A session and
        revision guard prevents stale clients from navigating a different history.
        Edits can send the same guard as X-HiCT-History-Session and
        X-HiCT-History-Revision headers. Restoration invalidates tiles and tracks.
      operationId: restoreAssemblyHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, revision, action]
              properties:
                session: { type: string }
                revision: { type: integer, format: int64 }
                action: { type: string, enum: [undo, redo, restore] }
                id: { type: integer, format: int64, description: Required for restore }
                assemblyFormat: { type: string, enum: [compact-v1] }
      responses:
        '200':
          description: Complete assemblyInfo and tile version; current journal summary in X-HiCT-History.
          content:
            application/json:
              schema: { type: object }
        '409':
          description: Stale session or revision. Fetch the journal and retry deliberately.
  /version:
    get:
      tags: [Info]
      summary: Get backend/server version metadata
      operationId: getVersion
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /changelog:
    get:
      tags: [Info]
      summary: Get packaged end-user changelog text
      operationId: getChangelog
      responses:
        '200':
          description: Changelog text for the current build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogResponse'
  /diagnostics/workers:
    post:
      tags: [Info]
      summary: Get worker scheduler diagnostics snapshot
      operationId: getWorkerDiagnostics
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Scheduler diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'
  /native_processing/status:
    post:
      tags: [Info]
      summary: Get optional native-processing backend status
      operationId: getNativeProcessingStatus
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Native-processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeProcessingStatus'
  /native_processing/enabled:
    post:
      tags: [Info]
      summary: Enable or disable optional native-processing backend use
      operationId: setNativeProcessingEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNativeProcessingEnabledRequest'
      responses:
        '200':
          description: Native-processing status after applying the requested setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeProcessingStatus'
  /statistics:
    post:
      tags: [Info]
      summary: Get server runtime and request statistics
      operationId: getRuntimeStatistics
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Runtime statistics snapshot with native-processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatistics'
  /api/v1:
    get:
      tags: [Info]
      summary: Redirect to interactive API docs
      operationId: apiDocsRedirect
      responses:
        '307':
          description: Temporary redirect to `/api/v1/`
  /api/v1/:
    get:
      tags: [Info]
      summary: Interactive API docs (Swagger UI HTML)
      operationId: apiDocsHtml
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
  /api/v1/assets/swagger-ui.css:
    get:
      tags: [Info]
      summary: Bundled Swagger UI stylesheet
      operationId: getSwaggerStylesheet
      responses:
        '200':
          description: Local stylesheet
        '304':
          description: Asset is unchanged
  /api/v1/assets/swagger-ui-bundle.js:
    get:
      tags: [Info]
      summary: Bundled Swagger UI JavaScript
      operationId: getSwaggerBundle
      responses:
        '200':
          description: Local JavaScript bundle
        '304':
          description: Asset is unchanged
  /api/v1/openapi:
    get:
      tags: [Info]
      summary: Redirect to OpenAPI source document
      operationId: apiSpecRedirect
      responses:
        '307':
          description: Temporary redirect to `/api/v1/openapi.yaml`
  /api/v1/openapi.yaml:
    get:
      tags: [Info]
      summary: OpenAPI v1 source specification
      operationId: apiSpecYaml
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

  /list_files:
    post:
      tags: [Files]
      summary: List openable HiCT files in DATA_DIR
      operationId: listFiles
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Relative paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /list_files_detailed:
    post:
      tags: [Files]
      summary: List DATA_DIR files with metadata
      operationId: listFilesDetailed
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: File entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'
  /list_directory:
    post:
      tags: [Files]
      summary: List one DATA_DIR directory without recursive traversal
      operationId: listDirectory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDirectoryRequest'
      responses:
        '200':
          description: Immediate child files and directories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'
  /list_fasta_files:
    post:
      tags: [Files]
      summary: List FASTA files in DATA_DIR
      operationId: listFastaFiles
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: FASTA paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /list_agp_files:
    post:
      tags: [Files]
      summary: List AGP files in DATA_DIR
      operationId: listAgpFiles
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: AGP paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /list_coolers:
    post:
      tags: [Files]
      summary: List convertible matrix files in DATA_DIR (.hic/.cool/.mcool)
      operationId: listCoolers
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Cooler paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /list_convertible_matrices:
    post:
      tags: [Files]
      summary: List convertible matrix files in DATA_DIR (.hic/.cool/.mcool)
      operationId: listConvertibleMatrices
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Convertible matrix paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /resolve_matrix_source:
    post:
      tags: [Files]
      summary: Resolve a matrix file to either a direct-open path or a cache-aware conversion target
      operationId: resolveMatrixSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbeTrackRequest' }
      responses:
        '200':
          description: Matrix source resolution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatrixSourceResolution' }
  /cache/drop_all:
    post:
      tags: [Files]
      summary: Drop matrix conversion metadata and 1D track precompute caches
      operationId: dropAllCaches
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Cache drop summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }

  /open:
    post:
      tags: [Files]
      summary: Open primary HiCT source
      operationId: openPrimarySource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFileRequest'
            example:
              filename: build/quad/combined_ind2_4DN.hict.hdf5
              fastaFilename: build/quad/quad_combined_ind2.fasta
      responses:
        '200':
          description: Opened file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFileResponse'
  /open_progress:
    post:
      tags: [Files]
      summary: Get progress of current open operation
      operationId: getOpenProgress
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Open progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProgressResponse'
  /workspace/state:
    post:
      tags: [Files]
      summary: Retain frontend workspace state for attachment to the active map
      operationId: saveWorkspaceState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, state, expectedVersion]
              properties:
                filename: { type: string }
                expectedVersion: { $ref: '#/components/schemas/WorkspaceVersion' }
                state:
                  type: object
                  required: [version]
                  properties:
                    version: { type: integer, enum: [1] }
                  additionalProperties: true
      responses:
        '200':
          description: State retained in memory; returned by attach. Maximum serialized size is 1 MB.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  workspaceVersion: { $ref: '#/components/schemas/WorkspaceVersion' }
        '400':
          description: Unsupported or oversized state
        '409':
          description: Active map session changed or another client saved newer workspace settings; attach again before saving.
  /attach:
    post:
      tags: [Files]
      summary: Attach to currently opened session
      operationId: attachSession
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Attached session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResponse'
  /close:
    post:
      tags: [Files]
      summary: Close current session
      operationId: closeSession
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Session close status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'

  /secondary/status:
    post:
      tags: [Secondary source]
      summary: Get secondary source status
      operationId: getSecondaryStatus
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Secondary source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondarySourceStatus'
  /secondary/open:
    post:
      tags: [Secondary source]
      summary: Open secondary source
      operationId: openSecondarySource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSecondaryRequest'
            example:
              filename: build/quad/combined_ind1_4DN.hict.hdf5
              allowMismatch: false
      responses:
        '200':
          description: Secondary source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondarySourceStatus'
  /secondary/close:
    post:
      tags: [Secondary source]
      summary: Close secondary source
      operationId: closeSecondarySource
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Secondary source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondarySourceStatus'
  /session/snapshot:
    post:
      tags: [Session]
      summary: Capture assembly and rendering state for session construction
      description: Read-only internal snapshot, not a portable saved session. Optional fingerprinting reads matrix, FASTA and physical track contents. Assembly verification checks reconstruction. When all three verification options are enabled, validate the serialized resource snapshot (including view and scope references), then prepare both sources, tracks, linked FASTA aliases and rendering configuration together, checking fingerprints before and after preparation without publishing the candidate. Optional X-HiCT-History-Session and X-HiCT-History-Revision headers reject stale displayed assemblies.
      operationId: getSessionSnapshot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verifyTrackDefinitions:
                  type: boolean
                  default: false
                  description: Prepare tracks in an isolated manager, preserving IDs, order and settings, and validate bounded rendering expressions and track references without silently substituting invalid values.
                fingerprintFiles:
                  type: boolean
                  default: false
                  description: Record the identity of matrix, linked FASTA and physical track files. By default (algorithm HICT-QUICK-1) this covers the size, the first and last 4 MiB and 16 spaced blocks, so it stays fast for multi-gigabyte files. Virtual weights tracks reference their fingerprinted map source.
                fullFingerprints:
                  type: boolean
                  default: false
                  description: With fingerprintFiles, hash every byte with SHA-256 instead. May take minutes for large inputs.
                verifyAssemblyRoundTrip:
                  type: boolean
                  default: false
                  description: Open independent candidates and verify AGP, assembly descriptors and metadata without publishing them.
      responses:
        '200':
          description: Detached assembly and rendering snapshot
          content:
            application/json:
              schema:
                type: object
                required: [snapshotVersion, assemblyVerified, filesFingerprinted, tracksVerified, primary, assemblySource, renderPipeline, tracks, workspace]
                properties:
                  snapshotVersion: { type: integer, enum: [1, 2], description: New captures use v2 with explicit bin origins and exact-cut replay support. V1 snapshots remain readable with their original destructive split semantics. }
                  filesFingerprinted: { type: boolean }
                  tracksVerified: { type: boolean }
                  assemblyVerified: { type: boolean, description: Whether isolated candidate assembly reconstruction succeeded for all open sources. Does not verify source content fingerprints or complete session restoration. }
                  primary: { $ref: '#/components/schemas/SessionSourceSnapshot' }
                  secondary:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/SessionSourceSnapshot'
                  assemblySource: { type: string, enum: [PRIMARY, SECONDARY] }
                  renderPipeline: { type: object, additionalProperties: true }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
                  workspace: { type: object, additionalProperties: true }
        '404': { description: No open map }
        '409': { description: Displayed assembly revision is stale }
  /session/restore:
    post:
      tags: [Session]
      summary: Replace the live session with a saved snapshot
      description: Accepts the body produced by /session/snapshot with fingerprintFiles enabled. The snapshot is validated, then every resource (both sources with their edited assemblies, linked FASTA files, tracks, processing graph and visualization options) is prepared in an isolated candidate and its files are checked before and after preparation. Only a complete candidate is published, in one step, and the previous resources are closed afterwards. Any failure leaves the current session unchanged. The response has the shape of /attach plus the restored assemblySource, renderPipeline, visualizationOptions and tracks.
      operationId: restoreSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Restored session
          content:
            application/json:
              schema:
                type: object
                required: [filename, fastaFilename, assemblySource, secondarySource, openFileResponse, renderPipeline, visualizationOptions, tracks]
                properties:
                  filename: { type: string }
                  fastaFilename: { type: string }
                  assemblySource: { type: string, enum: [PRIMARY, SECONDARY] }
                  secondarySource: { $ref: '#/components/schemas/SecondarySourceStatus' }
                  workspaceVersion: { type: object, additionalProperties: true }
                  workspaceState: { type: object, nullable: true, additionalProperties: true }
                  openFileResponse: { type: object, additionalProperties: true }
                  renderPipeline: { type: object, additionalProperties: true }
                  visualizationOptions: { type: object, additionalProperties: true }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
        '400': { description: Malformed snapshot or a file whose identity changed }
  /secondary/set_assembly_source:
    post:
      tags: [Secondary source]
      summary: Choose source of assembly descriptors (PRIMARY/SECONDARY)
      operationId: setAssemblySource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAssemblySourceRequest'
      responses:
        '200':
          description: New assembly source and assembly payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'

  /set_visualization_options:
    post:
      tags: [Rendering]
      summary: Set visualization options and optionally preserve the active custom rendering pipeline
      operationId: setVisualizationOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualizationOptionsRequest'
      responses:
        '200':
          description: Effective visualization options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'
        '409':
          description: A required secondary source or track is unavailable. The supplied visualization is rejected atomically.
  /get_visualization_options:
    post:
      tags: [Rendering]
      summary: Get current visualization options
      operationId: getVisualizationOptions
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Current visualization options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'
  /visualization/expected_profile:
    post:
      tags: [Rendering]
      summary: Recompute the viewport-shared expected profile used by Expected and O/E display modes
      operationId: setViewportExpectedProfile
      description: >-
        Fits positive finite signal within scaffolds (or unscaffolded contigs),
        using absolute display-bin separations. Repeated references after exact
        cuts share one unit of support per unordered physical source-bin pair
        across the complete fitting window, including both symmetric orientations.
        Successful fits report sampleSemantics=UNIQUE_UNORDERED_SOURCE_PAIR_MASS,
        distanceSemantics=DISPLAY_BIN_DISTANCE and sharedReferenceWeighting.
        Histogram and matrix-statistics counts describe DISPLAY_CELLS instead.
        unit defaults to PIXELS (visible native bins). BINS includes hidden
        components and is used by sequence-grid display. Their cached profiles
        are independent; responses report the fitted unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedProfileViewportRequest'
      responses:
        '200':
          description: Status of the cached expected-profile refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMap'
  /visualization/captures:
    post:
      tags: [Rendering]
      summary: Pin immutable rendering inputs for figure tiles
      operationId: createRenderCapture
      description: >-
        Creates a five-minute context independent of the live viewport profile.
        Send its id as renderCapture on every figure tile, validate after drawing,
        and release on success, failure or cancellation. Source, assembly,
        normalization, rendering and track changes invalidate it. Expected/O/E
        fit one primary profile with actual-means SHA-256 and grid provenance.
        At most four contexts and 64 MiB are retained; one fit runs at a time.
        Expected fitting windows are limited to 16777216 cells and 65536 bins per axis; use a coarser view
        for larger figures. Observed contexts do not fit an Expected profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedProfileViewportRequest' }
      responses:
        '200':
          description: Context id, signal mode, normalization inputs and optional Expected profile provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409': { description: Map missing or inputs changed during fitting }
        '413': { description: Expected fitting window exceeds the capture work budget }
        '429': { description: Context count, memory or concurrent fitting budget exhausted }
  /visualization/captures/{id}/validate:
    post:
      tags: [Rendering]
      summary: Check that a figure still uses the captured scientific inputs
      operationId: validateRenderCapture
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Valid capture provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMap' }
        '409': { description: Context expired, released or invalidated }
  /visualization/captures/{id}/release:
    post:
      tags: [Rendering]
      summary: Release a figure context and its fitted arrays
      operationId: releaseRenderCapture
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Released or already absent }
  /render_pipeline/get:
    post:
      tags: [Rendering]
      summary: Get current rendering pipeline graph configuration
      operationId: getRenderPipeline
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Render pipeline config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderPipelineConfig'
  /render_pipeline/set:
    post:
      tags: [Rendering]
      summary: Replace rendering pipeline graph configuration
      operationId: setRenderPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderPipelineConfig'
      responses:
        '200':
          description: Render pipeline config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderPipelineConfig'
  /render_pipeline/reset:
    post:
      tags: [Rendering]
      summary: Reset rendering pipeline to disabled/default state
      operationId: resetRenderPipeline
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: Render pipeline config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderPipelineConfig'

  /tiles/reload:
    post:
      tags: [Tiles]
      summary: Drop tile/track caches and increment generation
      operationId: reloadTiles
      requestBody: { $ref: '#/components/requestBodies/EmptyBody' }
      responses:
        '200':
          description: New generation version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    format: int64
                required: [version]
  /get_tile:
    get:
      tags: [Tiles]
      summary: Fetch map tile or arbitrary pixel rectangle
      operationId: getTile
      parameters:
        - name: renderCapture
          in: query
          required: false
          description: Pinned figure context returned by POST /visualization/captures
          schema: { type: string, format: uuid }
        - in: query
          name: row
          required: true
          schema: { type: integer, format: int64 }
          description: Tile row index, or start row in pixels for PNG_BY_PIXELS.
        - in: query
          name: col
          required: true
          schema: { type: integer, format: int64 }
          description: Tile column index, or start col in pixels for PNG_BY_PIXELS.
        - in: query
          name: version
          required: false
          schema: { type: integer, format: int64, default: 0 }
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [JSON_PNG_WITH_RANGES, PNG, PNG_BY_PIXELS]
            default: JSON_PNG_WITH_RANGES
        - in: query
          name: bpResolution
          required: false
          schema: { type: integer, format: int64 }
          description: Exact bp resolution. Optional alternative to `level`.
        - in: query
          name: source
          required: false
          schema: { type: string, enum: [PRIMARY, SECONDARY] }
          description: Request one source. An omitted source returns the composed tile.
        - in: query
          name: sequenceScale
          required: false
          schema: { type: boolean, default: false }
          description: >-
            Draw source-bin colors on a uniform one-base display grid. Requires an
            explicit source and cannot be combined with gridBpResolution or
            gridSampleFactor. bpResolution still selects a stored contact level;
            no counts or contact positions are interpolated. Tile coordinates
            (or row/col with PNG_BY_PIXELS) now index assembly bases, including
            sequence in components hidden at the stored matrix level.
        - in: query
          name: gridBpResolution
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
          description: For a secondary tile, project native bins onto this primary assembly level.
        - in: query
          name: gridSampleFactor
          required: false
          schema: { type: integer, minimum: 1, maximum: 65536, default: 1 }
          description: Subdivide each projected primary grid cell by this factor along each axis.
        - in: query
          name: level
          required: false
          schema: { type: integer }
          description: Resolution level in reversed order. Optional alternative to `bpResolution`.
        - in: query
          name: tile_size
          required: false
          schema: { type: integer, minimum: 1, maximum: 1024, default: 256 }
          description: Tile edge size for tile-based queries.
        - in: query
          name: rows
          required: false
          schema: { type: integer, minimum: 1, maximum: 1024 }
          description: Height in pixels for PNG_BY_PIXELS.
        - in: query
          name: cols
          required: false
          schema: { type: integer, minimum: 1, maximum: 1024 }
          description: Width in pixels for PNG_BY_PIXELS.
      responses:
        '200':
          description: Tile payload. Cancelled work returns a transparent placeholder with x-hict-cancelled=true; clients must not cache or display it as a rendered map tile.
          headers:
            x-hict-cancelled:
              description: True only when superseded work was cancelled.
              schema: { type: boolean }
            x-hict-display-grid:
              description: SEQUENCE_BP for an explicitly requested one-base display grid.
              schema: { type: string }
            x-hict-source-bp-resolution:
              description: Original stored contact resolution for a sequence-scale tile.
              schema: { type: integer, format: int64 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TileWithRangesResponse'
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid tile dimensions or coordinates
        '503':
          description: The server queue is full. Retry the request shortly.
  /matrix/statistics:
    post:
      tags: [Tiles]
      summary: Exact finite extrema of a bounded display-signal block
      description: |
        First request metadataOnly to obtain the current revision and full visible-pixel
        extent of the resolution. Then visit every 512 by 512 block using that revision.
        Both triangles and implicit zeros are included; there is no sampling or float32
        conversion. Partial edge blocks are clipped to the map. Non-finite values are
        excluded from count and extrema. Any rendering/assembly invalidation cancels
        the snapshot with HTTP 409. Statistics run on the export worker pool.
        PIPELINE_SIGNAL (the default) evaluates the supplied numeric expression.
        TRADITIONAL_NORMALIZED follows primary visualization processing. In Expected
        or O/E mode it fits one whole-resolution, within-scaffold positive-finite
        expected profile and reuses it across blocks. It does not read or replace the
        viewport profile. The first block therefore needs an additional complete
        bounded-memory pass. Undefined O/E support is excluded; supported zeros count.
        Counts describe visible display cells, including repeated references after
        exact cuts, rather than independent physical contacts. A scan changes no
        colors, processing settings or viewport state.
      operationId: queryMatrixStatistics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpResolution]
              properties:
                bpResolution: { type: integer, format: int64, minimum: 1 }
                metadataOnly: { type: boolean, default: false }
                revision: { type: string }
                startRowPx: { type: integer, format: int64, minimum: 0 }
                startColPx: { type: integer, format: int64, minimum: 0 }
                signalMode:
                  type: string
                  enum: [PIPELINE_SIGNAL, TRADITIONAL_NORMALIZED]
                  default: PIPELINE_SIGNAL
                expression: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Snapshot metadata or exact block extrema
          content:
            application/json:
              schema:
                type: object
                required: [revision, size]
                properties:
                  revision: { type: string }
                  size: { type: integer, format: int64 }
                  signalMode: { type: string }
                  expectedProfileScope: { type: string, enum: [WHOLE_MAP] }
                  rows: { type: integer }
                  cols: { type: integer }
                  count: { type: integer, format: int64 }
                  min: { type: number, format: double, nullable: true }
                  max: { type: number, format: double, nullable: true }
        '409':
          description: Snapshot invalidated; restart the scan

  /matrix/query:
    post:
      tags: [Tiles]
      summary: Fetch rectangular submatrix as numeric tensor-ready payload
      description: |
        `TRADITIONAL_NORMALIZED` follows the active visualization settings. When the UI is set to `Expected` or `O/E`,
        the returned signal uses the active distance-expected profile when it covers the query window,
        otherwise a profile fitted to the query window after the selected raw-or-balanced normalization steps.
        Undefined O/E support is missing (NaN in floating-point binary output and null in JSON),
        matching transparent map cells. A supported measured zero remains zero.
        Assembly axes reference original source bins. Exact cuts can display the same
        bin more than once. These references must not be summed as independent
        observations. `includeBinProvenance: true` with JSON returns compact physical
        bin runs for each axis, allowing repeated references to be identified.
        Pipeline values are display-grid expressions and may depend on tracks or
        other sources; their axis provenance describes the selected source grid.
        `PIPELINE_SIGNAL` projects a required secondary input onto the primary grid when stored resolution levels differ.
        `BINS` queries include hidden assembly components on both sources; `PIXELS` queries use visible components.
        A primary-only expression does not read an unused secondary matrix. Projected values are display-grid signals,
        not new native contact observations.
      operationId: queryMatrix
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixQueryRequest' }
            examples:
              normalizedPixels:
                summary: Traditional normalized signal in visible pixels
                value:
                  bpResolution: 50000
                  unit: PIXELS
                  startRowPx: 0
                  endRowPx: 256
                  startColPx: 0
                  endColPx: 256
                  signalMode: TRADITIONAL_NORMALIZED
                  format: BINARY_FLOAT32
              rawBins:
                summary: Raw counts in bins as int64 JSON
                value:
                  bpResolution: 50000
                  unit: BINS
                  startRowBin: 0
                  endRowBin: 32
                  startColBin: 0
                  endColBin: 32
                  signalMode: RAW_COUNTS
                  format: JSON
      responses:
        '200':
          description: Matrix payload
          headers:
            x-hict-cancelled:
              description: True when superseded work was cancelled; the empty payload is not a zero-valued matrix.
              schema: { type: boolean }
            x-hict-rows:
              schema: { type: integer }
            x-hict-cols:
              schema: { type: integer }
            x-hict-dtype:
              schema: { type: string, enum: [float32, float64, int64] }
            x-hict-signal-mode:
              schema: { type: string }
            x-hict-cell-semantics:
              schema: { type: string, enum: [SOURCE_BIN_REFERENCES, DISPLAY_GRID_SIGNAL] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixQueryJsonResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary

