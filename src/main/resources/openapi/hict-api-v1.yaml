  /get_fasta_for_assembly:
    post:
      tags: [Files]
      summary: Export FASTA for current full assembly
      operationId: exportFastaAssembly
      description: >-
        Optional X-HiCT-History-Session and X-HiCT-History-Revision headers
        reject a stale displayed assembly before export. Layout metadata is
        captured on the assembly queue before background materialization.
        Cancellation returns 409 rather than an empty successful download.
      parameters:
        - in: header
          name: X-HiCT-History-Session
          schema: { type: string }
          description: Displayed history session identity, paired with revision.
        - in: header
          name: X-HiCT-History-Revision
          schema: { type: integer, format: int64 }
          description: Applied displayed revision, paired with session identity.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GetFastaForAssemblyRequest' }
      responses:
        '409':
          description: Displayed assembly is stale or export was cancelled; refresh and retry.
        '200':
          description: FASTA text
          content:
            text/plain:
              schema:
                type: string
  /get_fasta_for_selection:
    post:
      tags: [Files]
      summary: Export FASTA for current selection
      operationId: exportFastaSelection
      description: >-
