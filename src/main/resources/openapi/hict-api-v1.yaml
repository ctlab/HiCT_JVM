  /tracks/query_1d:
    post:
      tags: [Tracks]
      summary: Query visible 1D track segments in given unit/range
      operationId: queryTracks1D
      description: >-
        With sequenceScale=true and BP units, uses a uniform assembly-base display
        including hidden and binless components. bpResolution remains a stored
        source level. Response bpResolution is 1 and displayGrid is SEQUENCE_BP,
        with sourceBpResolution explicit. Native-bin sidecars are not reused.
        Cooler weights retain their source-bin values and report each track's
        actual samplingBpResolution; an unavailable secondary level falls back to
        that source's finest stored level. Width is limited to 8192 and span to
        1048576 bases. No contact counts are interpolated by this track query.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackQueryRequest' }
      responses:
        '200':
          description: Queried tracks values and ranges
